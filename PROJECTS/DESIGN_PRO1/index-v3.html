const FDOC={
  colors:{purpose:'Colour communicates brand, hierarchy and state. Each language owns a palette; components only read semantic aliases such as <code>--pri</code>, <code>--fg</code> and <code>--err</code>.',princ:['One accent per language, used for action and selection','Status colours are separate from the accent and always paired with text or an icon','Neutrals carry most of the interface','Every colour has a light and a dark value'],use:['Use the primary colour for the main action and the selected state','Use semantic tokens (<code>--ok</code>, <code>--warn</code>, <code>--err</code>) for status','Read colours through aliases, never hex values in components'],do:['Pair status colour with a word or icon','Test both themes'],dont:['Use the accent for decoration','Hard-code hex values in component CSS']},
  typography:{purpose:'Type sets reading comfort and hierarchy. Each language has its own ramp; components use role classes rather than font sizes.',princ:['A small, fixed set of roles','Hierarchy through size and weight, not colour alone','Body text stays at 14–15px for long working sessions'],use:['Use one heading level per region','Keep labels short and in sentence case','Use tabular numbers in tables and statistics'],do:['Use role classes (.ds-t-h2, .ds-t-body)','Keep lines near 70 characters'],dont:['Set ad-hoc font sizes','Use all caps for long text']},
  spacing:{purpose:'Spacing expresses density. All three languages share an 8px grid; they differ in which steps they reach for.',princ:['8px base grid','Gap tokens between siblings, not margins','Density is a token choice'],use:['Use <code>--gap</code> inside groups and <code>--gap-l</code> between sections','Change density by switching token values, not layouts'],do:['Lay out siblings with flex or grid gap'],dont:['Mix arbitrary pixel values','Remove whitespace to fit more data; use a denser language instead']},
  elevation:{purpose:'Elevation separates layers. Each language expresses depth differently on purpose, so the ramps are not normalised.',princ:['Atlassian-inspired: Flat, Raised, Overlay, Modal','Fluent-inspired: a structured shadow ramp, 2 to 64','Apple-inspired: Flat, Soft, Float, Sheet, plus blur materials'],use:['Raise only what floats above the page: menus, popovers, dialogs','Keep cards flat or lowest level unless they are interactive'],do:['Use the language’s own levels'],dont:['Borrow another language’s shadows','Stack several shadows to create emphasis']},
  icons:{purpose:'Icons support labels and save space in dense toolbars. One outline set is drawn with each language’s size and stroke.',princ:['One icon set, three renderings','Icons support text; icon-only buttons need a name and tooltip'],use:['Use 16–18px in controls','Inherit colour from text'],do:['Give icon-only buttons an aria-label'],dont:['Use an icon as the only signal of status']}
};

  ${docBottom(d)}${cmpTable([['Scale','3 / 4 / 6px','2 / 4 / 8 / 12px','6 / 10 / 14 / 20px'],['Controls','3px','4px','10px'],['Cards and menus','4–6px','8px','14–20px'],['Chips and tags','3px','Pill','Capsule']])}</div>`;
},after(root){$$('[data-tok]',root).forEach(c=>{c.textContent=c.dataset.tok.replace(/^--\w-/,'')+' · '+getComputedStyle(c.closest('.lab-stage')).getPropertyValue(c.dataset.tok).trim()})}});

P({id:'motion',title:'Motion',section:'foundations',icon:'bolt',kind:'custom',render(){
  const d={purpose:'Motion explains change: where something came from and where it went. Each language moves at its own speed.',princ:['Motion confirms an action; it never delays it','Shorter for small elements, longer for large surfaces','Respect reduced-motion settings'],use:['Use <code>--dur</code> and <code>--ease</code> for state changes','Use component tokens for indicators, switches and overlays'],do:['Animate opacity and transform'],dont:['Animate layout properties on large lists','Add motion that plays on every page load']};

  ${docBottom(d)}${cmpTable([['Base duration','100ms','150ms','250ms'],['Easing','Quick ease-out','Decelerate (0.1, 0.9, 0.2, 1)','Spring-like (0.32, 0.72, 0, 1)'],['Indicators','150ms','250ms','320ms'],['Overlays','150ms slide','250ms scale','300ms scale + blur'],['Reduced motion','Respected','Respected','Respected']])}</div>`;
},after(root){

  $$('.lab-stage',root).forEach(st=>{const tr=st.querySelector('[data-track]');if(!tr)return;st.querySelector('[data-play]').addEventListener('click',()=>{tr.style.setProperty('--track-w',tr.clientWidth+'px');tr.classList.toggle('is-on')})});
}});

P({id:'pattern-tables',title:'Tables',section:'patterns',icon:'table',cls:['ds-table','ds-tbar','ds-tablewrap'],wide:true,
  desc:'A data-heavy table with column customisation, density, grouping, sorting and export. Inline editing lives on the Data Grid sheet.',
  demo:k=>{const m=uid('cols');return `<div class="ds-col" data-ptable><div class="ds-tbar"><h3 class="ds-t-h3" style="margin-right:auto">Inventory · Warehouse 3</h3><div class="ds-anchor">${B('Columns',{icon:'sliders',keep:1,chev:1,attrs:`data-ds="menu" aria-haspopup="menu" aria-expanded="false" aria-controls="${m}"`})}<div class="ds-pop ds-pop--right" id="${m}" role="menu" aria-label="Visible columns" hidden>${['SKU','Item','Status','Owner','Qty','Updated'].map((c,i)=>`<div class="ds-opt" role="menuitemcheckbox" aria-checked="true" tabindex="-1" data-col="${i}"><span class="ds-opt__label">${c}</span>${ic('check','ds-opt__tick')}</div>`).join('')}</div></div><div class="ds-bgroup" role="group" aria-label="Density" data-ds="seg">${B('Comfortable',{sz:'s',attrs:'aria-pressed="true" data-density="c"'})}${B('Compact',{sz:'s',attrs:'aria-pressed="false" data-density="d"'})}</div>${SW('Group by status')}${B('Export',{v:'subtle',icon:'download',keep:1,attrs:'data-export'})}</div><div class="ds-tablewrap"><table class="ds-table"><caption class="ds-sr">Inventory</caption><thead><tr>${[['SKU'],['Item'],['Status'],['Owner'],['Qty','num'],['Updated']].map(([h,c],i)=>`<th scope="col" data-c="${i}"${c?` class="${c}"`:''}><button type="button" class="ds-sort">${h}${ic('arrow-up')}</button></th>`).join('')}</tr></thead><tbody></tbody></table></div><span class="ds-faint ds-small" data-tcount></span><span class="ds-sr" aria-live="polite"></span></div>`},
  init(st,k){const box=st.querySelector('[data-ptable]');const tb=box.querySelector('tbody');const hidden=new Set();let group=false;
    const ROWS=[['INV-1042','Laptop 14" (fleet)',['Low stock','warning'],'Aiko Kato',12,'Today'],['INV-1043','Docking station',['In stock','success'],'Liam Shah',148,'Today'],['INV-1051','USB-C cable 2m',['In stock','success'],'Liam Shah',920,'Yesterday'],['INV-1060','Monitor 27"',['Backordered','danger'],'Priya Nair',0,'2d ago'],['INV-1061','Keyboard, US layout',['Low stock','warning'],'Aiko Kato',18,'3d ago'],['INV-1077','Headset, wired',['In stock','success'],'Tomás Weber',260,'5d ago']];
    const row=r=>`<tr><td data-c="0">${r[0]}</td><td data-c="1">${r[1]}</td><td data-c="2" data-v="${r[2][0]}">${BADGE(r[2][0],r[2][1])}</td><td data-c="3">${r[3]}</td><td data-c="4" class="num" data-v="${r[4]}">${r[4].toLocaleString('en-US')}</td><td data-c="5">${r[5]}</td></tr>`;
    const draw=()=>{if(group){const gs=[...new Set(ROWS.map(r=>r[2][0]))];tb.innerHTML=gs.map(g=>{const rs=ROWS.filter(r=>r[2][0]===g);return `<tr class="grp"><th colspan="6" scope="rowgroup" style="text-align:left;background:var(--sunk);font-weight:600;height:30px;padding:0 var(--td-px)">${g} <span class="ds-faint">(${rs.length})</span></th></tr>`+rs.map(row).join('')}).join('')}else tb.innerHTML=ROWS.map(row).join('');
      $$('[data-c]',box).forEach(c=>c.hidden=hidden.has(+c.dataset.c));$$('.ds-sort',box).forEach(b=>b.disabled=group);box.querySelector('[data-tcount]').textContent=`${ROWS.length} items · ${6-hidden.size} of 6 columns`};
    box.addEventListener('click',e=>{const c=e.target.closest('[data-col]');if(c){setTimeout(()=>{c.getAttribute('aria-checked')==='true'?hidden.delete(+c.dataset.col):hidden.add(+c.dataset.col);if(hidden.size===6){hidden.delete(+c.dataset.col);c.setAttribute('aria-checked','true')}draw()});e.stopPropagation();c.setAttribute('aria-checked',String(c.getAttribute('aria-checked')!=='true'));return}
      const d=e.target.closest('[data-density]');if(d)setTimeout(()=>box.querySelector('.ds-table').style.setProperty('--row',d.dataset.density==='d'?'28px':''));
      if(e.target.closest('[data-export]'))toast(k,{title:'Export ready',text:`${ROWS.length} rows, ${6-hidden.size} columns as CSV (demo, no file is created).`,v:'success'})});
    box.addEventListener('change',e=>{if(e.target.getAttribute('role')==='switch'){group=e.target.checked;draw()}});
    draw()},
  cmp:[['Row height (comfortable / compact)','36 / 28px','44 / 28px','48 / 28px'],['Group header','Sunken band','Sunken band','Sunken band'],['Column menu','Flat menu with checks','Rounded menu with checks','Material menu with checks']],
  a11y:'Column visibility uses <code>menuitemcheckbox</code>. Group rows are header cells with <code>scope="rowgroup"</code>. Sorting is disabled while grouped so the order stays predictable.',keys:[['Enter','Open the Columns menu or sort a column'],['Space','Toggle a column in the menu']]});

P({id:'pattern-dashboard',title:'Dashboards',section:'patterns',icon:'chart',cls:['ds-stat','ds-panel','ds-chart'],wide:true,
  desc:'KPIs, a chart, a filter and drill-down into the records behind a bar.',
  demo:k=>`<div class="ds-stack" data-pdash><div class="ds-tbar"><h3 class="ds-t-h3" style="margin-right:auto">Sales pipeline</h3><div class="ds-bgroup" role="group" aria-label="Period" data-ds="seg">${B('Q2',{sz:'s',attrs:'aria-pressed="false" data-q="2"'})}${B('Q3',{sz:'s',attrs:'aria-pressed="true" data-q="3"'})}</div></div><div class="ds-stats" data-kpis></div><div class="ds-panel"><div class="ds-tbl-cap"><b>Closed-won deals by month</b><span class="ds-faint ds-small">Select a bar for details</span></div><div data-chart></div></div><div class="ds-panel" data-drill aria-live="polite"></div></div>`,
  init(st,k){const box=st.querySelector('[data-pdash]');let q=3,sel=null;
    const D={2:{m:['Apr','May','Jun'],v:[14,19,16],kp:[['Pipeline','$4.2M','',+6],['Win rate','31','%',-2],['Avg. deal','$58k','',+4]]},3:{m:['Jul','Aug','Sep'],v:[18,23,27],kp:[['Pipeline','$5.1M','',+21],['Win rate','34','%',+3],['Avg. deal','$61k','',+5]]}};
    const ACC=['Northwind Retail','Contoso Freight','Fabrikam Health','Tailspin Air','Litware Labs','Adatum Bank'];
    const draw=()=>{const d=D[q];
      box.querySelector('[data-kpis]').innerHTML=d.kp.map(([l,v,u,dl])=>`<div class="ds-stat"><span class="ds-stat__label">${l}</span><span class="ds-stat__value">${v}${u?`<small>${u}</small>`:''}</span><span class="ds-stat__delta${dl<0?' is-down':''}">${ic(dl<0?'trend-down':'trend-up')}${dl>0?'+':''}${dl}% <span>vs last quarter</span></span></div>`).join('');
      const W=480,H=190,pl=34,pb=26,pt=10,max=30,bw=70;const x=i=>pl+30+i*((W-pl-60)/3)+((W-pl-60)/3-bw)/2;const y=v=>pt+(H-pt-pb)*(1-v/max);
      box.querySelector('[data-chart]').innerHTML=`<svg class="ds-chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Closed-won deals by month" style="width:100%;max-width:640px;height:auto;display:block">${[0,10,20,30].map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--sep)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--fg3)">${t}</text>`).join('')}${d.v.map((v,i)=>`<g role="button" tabindex="0" data-bar="${i}" aria-label="${d.m[i]}: ${v} deals" style="cursor:pointer;outline:none"><rect x="${x(i)}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="${k==='p'?6:k==='f'?4:2}" fill="var(--pri)" opacity="${sel===null||sel===i?1:.35}"/><text x="${x(i)+bw/2}" y="${y(v)-6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${v}</text><text x="${x(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--fg2)">${d.m[i]}</text></g>`).join('')}</svg>`;
      const dr=box.querySelector('[data-drill]');if(sel===null){dr.innerHTML=`<p class="ds-muted" style="margin:0">Select a month to see its deals.</p>`}else{const n=d.v[sel];dr.innerHTML=`<div class="ds-tbl-cap"><b>${d.m[sel]} · ${n} deals</b><button type="button" class="ds-btn ds-btn--link ds-s" data-clear><span>Clear selection</span></button></div><ul class="ds-list">${ACC.slice(0,4).map((a,i)=>`<li class="ds-li"><div class="ds-li__main"><span class="ds-li__title">${a}</span><span class="ds-li__sub">Owner: ${PEOPLE[i].n}</span></div><span class="ds-li__end">$${(40+i*13+sel*7)}k</span></li>`).join('')}</ul>`}};
    box.addEventListener('click',e=>{const b=e.target.closest('[data-bar]');if(b){sel=+b.dataset.bar===sel?null:+b.dataset.bar;draw();box.querySelector(`[data-bar="${b.dataset.bar}"]`)?.focus();return}const qq=e.target.closest('[data-q]');if(qq){q=+qq.dataset.q;sel=null;setTimeout(draw)}if(e.target.closest('[data-clear]')){sel=null;draw()}});
    box.addEventListener('keydown',e=>{const b=e.target.closest('[data-bar]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
    draw()},
  cmp:[['KPI tiles','Bordered, small numbers','Raised cards','Large light numerals'],['Chart surface','Bordered panel','Raised card','Borderless rounded panel'],['Drill-down','List below the chart','List below the chart','List below the chart']],
  a11y:'Each bar is a focusable button with its value in the label; Enter selects it and the detail list updates in a live region. Numbers appear as text, not only as bar heights.',keys:[['Tab','Move between bars'],['Enter / Space','Show the month’s deals']]});

P({id:'pattern-workflow',title:'Workflow',section:'patterns',icon:'steps',cls:['ds-steps','ds-tl','ds-panel'],wide:true,
  desc:'An approval workflow: status, progress, decisions, history and comments for a purchase order.',
  demo:k=>`<div class="ds-panel" data-pwf><div class="ds-stack"><div class="ds-detail-h"><div class="ds-col" style="gap:4px"><span class="ds-faint ds-small">Procurement · PO-2291</span><h3 class="ds-t-h2">48 laptops for the Lisbon office</h3><div class="ds-row" style="gap:8px"><span data-status>${BADGE('Awaiting finance','warning')}</span><span class="ds-faint ds-small">$86,400 · requested by Liam Shah</span></div></div><div class="ds-row" data-acts>${B('Request changes',{attrs:'data-wf="changes"'})}${B('Reject',{v:'danger',attrs:'data-wf="reject"'})}${B('Approve',{v:'primary',icon:'check',attrs:'data-wf="approve"'})}</div></div>
  <ol class="ds-steps" aria-label="Approval progress">${[['Submitted','Liam Shah'],['Manager','Priya Nair'],['Finance','You'],['Ordered','Procurement']].map(([t,d],i)=>`<li class="ds-step${i<2?' is-done':''}${i===2?' is-current':''}"${i===2?' aria-current="step"':''}><span class="ds-step__dot">${i<2?ic('check'):i+1}</span><span class="ds-step__label"><b>${t}</b><small>${d}</small></span></li>`).join('')}</ol>
  <div class="ds-md-layout" style="min-height:0;--md-list-w:1fr"><div class="ds-col"><b>History</b><ol class="ds-tl" data-hist>${[['Priya Nair','approved as manager','Yesterday','ok',1],['Liam Shah','submitted the request','2d ago','plus']].map(([w,t,tm,i,key])=>`<li class="ds-tl__item${key?' is-key':''}"><span class="ds-tl__mark">${ic(i)}</span><div class="ds-tl__body"><div class="ds-tl__head"><b>${w}</b><time class="ds-tl__time">${tm}</time></div><p class="ds-tl__text">${t}</p></div></li>`).join('')}</ol></div><form class="ds-col" data-comment>${TA({label:'Comment',rows:3,ph:'Add context for the next approver'})}<div class="ds-row" style="justify-content:flex-end">${B('Add comment',{attrs:'type="submit"'}).replace('type="button" ','')}</div></form></div></div></div>`,
  init(st,k){const box=st.querySelector('[data-pwf]');const hist=box.querySelector('[data-hist]');
    const add=(w,t,icn,key)=>{hist.insertAdjacentHTML('afterbegin',`<li class="ds-tl__item${key?' is-key':''}"><span class="ds-tl__mark">${ic(icn)}</span><div class="ds-tl__body"><div class="ds-tl__head"><b>${w}</b><time class="ds-tl__time">Just now</time></div><p class="ds-tl__text">${esc(t)}</p></div></li>`)};
    const finish=(label,v,text)=>{box.querySelector('[data-status]').innerHTML=BADGE(label,v);$$('[data-acts] .ds-btn',box).forEach(b=>b.disabled=true)};
    box.addEventListener('click',e=>{const b=e.target.closest('[data-wf]');if(!b)return;const a=b.dataset.wf;
      if(a==='approve'){const steps=$$('.ds-step',box);steps[2].classList.replace('is-current','is-done');steps[2].removeAttribute('aria-current');steps[2].querySelector('.ds-step__dot').innerHTML=ic('check');steps[3].classList.add('is-current');steps[3].setAttribute('aria-current','step');finish('Approved','success');add('You','approved as finance','ok',1);toast(k,{title:'PO-2291 approved',text:'Procurement can place the order.',v:'success'})}
      if(a==='changes'){finish('Changes requested','info');add('You','requested changes','edit');toast(k,{title:'Sent back to Liam Shah',text:'The request returns to Submitted.'})}
      if(a==='reject'){const id=uid('rj');const Lr=openLayer(k,`<form class="ds-dialog ds-dialog--danger" role="alertdialog" aria-labelledby="${id}"><div class="ds-dialog__head"><span class="ds-dialog__ic">${ic('warn')}</span><h2 class="ds-dialog__title" id="${id}">Reject PO-2291?</h2></div><div class="ds-dialog__body"><p>Liam Shah will be notified. The request can’t be reopened.</p>${TA({label:'Reason',rows:2,ph:'What needs to change?',help:'Required'})}</div><div class="ds-dialog__foot">${B('Cancel',{v:k==='a'?'subtle':'',attrs:'data-close autofocus'})}<button type="submit" class="ds-btn ds-btn--danger"><span>Reject</span></button></div></form>`,'modal',b);
        Lr.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const ta=Lr.querySelector('textarea');if(!ta.value.trim()){const f=ta.closest('.ds-field');f.classList.add('is-error');f.querySelector('.ds-help').innerHTML=ic('err')+'Add a reason so the requester knows what to fix';ta.focus();return}Lr._close();finish('Rejected','danger');add('You','rejected: '+ta.value.trim(),'x');toast(k,{title:'PO-2291 rejected',v:'warning',text:'Liam Shah was notified.'})})}
    });
    box.querySelector('[data-comment]').addEventListener('submit',e=>{e.preventDefault();const ta=e.target.querySelector('textarea');if(!ta.value.trim()){ta.focus();return}add('You',ta.value.trim(),'message');ta.value=''})},
  cmp:[['Progress','Inline numbered steps','Discs with labels','Segmented bar'],['History','Compact dots','Icon circles','Spacious rings'],['Reject','Confirm with required reason','Confirm with required reason','Confirm with required reason']],
  a11y:'Progress is an ordered list with <code>aria-current="step"</code>. Rejection requires a reason and explains why when it is missing. The status badge and history update together.',keys:[['Tab','Move through actions and the comment box'],['Esc','Cancel the rejection dialog']]});

P({id:'pattern-auth',title:'Authentication',section:'patterns',icon:'lock',cls:['ds-panel','ds-field','ds-control'],
  desc:'A sign-in form with SSO, password visibility, validation and a remembered session. Demonstration only: nothing is sent anywhere.',
  demo:k=>{const id=uid('au');return `<form class="ds-panel" data-pauth novalidate style="max-width:400px;margin:0 auto"><div class="ds-stack"><div class="ds-col" style="gap:6px"><span class="ds-logo"><i aria-hidden="true"></i>Ledger</span><h3 class="ds-t-h2">Sign in</h3><p class="ds-muted ds-small" style="margin:0">Demo form: nothing you type leaves this page.</p></div>${B('Continue with company SSO',{icon:'globe',keep:1,attrs:'data-sso style="width:100%"'})}<div class="ds-divider-label">or</div>${TF({id:id+'-e',label:'Work email',type:'email',val:'maya.ruiz@ledger.example',lead:'mail',attrs:'autocomplete="off"'})}${TF({id:id+'-p',label:'Password',type:'password',help:'At least 8 characters',lead:'lock',attrs:'autocomplete="off"',trail:`<button type="button" class="ds-x" data-reveal aria-label="Show password" aria-pressed="false" style="width:auto;padding:0 6px;border-radius:4px;font-size:12px">Show</button>`})}<div class="ds-row" style="justify-content:space-between">${SW('Keep me signed in',{on:1})}<a class="ds-link" href="#">Forgot password?</a></div><button type="submit" class="ds-btn ds-btn--primary ds-l" style="width:100%"><span>Sign in</span></button></div></form>`},
  init(st,k){const f=st.querySelector('[data-pauth]');const pw=f.querySelector('input[type=password]');const btn=f.querySelector('[data-reveal]');
    btn.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';btn.textContent=show?'Hide':'Show';btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'Hide password':'Show password')});
    f.querySelector('[data-sso]').addEventListener('click',()=>toast(k,{title:'Redirecting to SSO',text:'In the real product this opens your identity provider.'}));
    f.addEventListener('submit',e=>{e.preventDefault();const fld=pw.closest('.ds-field'),h=fld.querySelector('.ds-help');if(pw.value.length<8){fld.classList.add('is-error');pw.setAttribute('aria-invalid','true');h.innerHTML=ic('err')+(pw.value?'Password must be at least 8 characters':'Enter your password');pw.focus();return}fld.classList.remove('is-error');pw.removeAttribute('aria-invalid');h.textContent='At least 8 characters';const sb=f.querySelector('[type=submit]');sb.setAttribute('aria-busy','true');setTimeout(()=>{sb.removeAttribute('aria-busy');pw.value='';toast(k,{title:'Signed in (demo)',text:'No credentials were sent or stored.',v:'success'})},900)})},
  cmp:[['Card','Bordered panel','Raised card','Borderless rounded panel'],['Primary button','Full width, 40px','Full width, 40px','Full width, 44px'],['Error','Red frame + message','Red bar + message','Red underline + message']],
  a11y:'Fields have visible labels and helpful errors. The show/hide control is a toggle button with <code>aria-pressed</code>. Autocomplete is off in this demo; a real form should use <code>autocomplete="username"</code> and <code>"current-password"</code>.',keys:[['Tab','Move through fields'],['Enter','Sign in']]});

P({id:'pattern-notifications',title:'Notifications',section:'patterns',icon:'bell',cls:['ds-list','ds-li','ds-badge'],
  desc:'A notification centre with unread state, filters, mark-as-read and live arrivals.',

const PART={'':'Container',lead:'Leading icon',chev:'Chevron',ic:'Icon',box:'Box with check mark',txt:'Label text',track:'Track',thumb:'Thumb',label:'Label',title:'Title',body:'Body',foot:'Footer',head:'Header',media:'Media',eyebrow:'Eyebrow',text:'Text',actions:'Actions',close:'Close button',dot:'Step marker',presence:'Presence indicator',main:'Primary text',sub:'Secondary text',end:'Trailing content',mark:'Marker',time:'Timestamp',btn:'Header button',panel:'Panel',meta:'Metadata',value:'Value',delta:'Trend',tw:'Disclosure toggle',row:'Row',x:'Remove button',tick:'Selection tick',desc:'Description',bar:'Fill',gutter:'Line numbers',input:'Input',list:'Results list',item:'Item',count:'Counter',badge:'Badge',spokes:'Activity spokes',grid:'Day grid',dow:'Weekday header',name:'File name',sel:'Selection count',acts:'Actions',out:'Preview',tag:'Function tag',h:'Drag handle',a:'First pane',b:'Second pane',sep:'Separator',hint:'Shortcut hint',code:'Code',ind:'Selection indicator',chip:'Chip',more:'Overflow',sm:'Small',path:'Location',kv:'Key–value list'};

function anatomy(p){
  const html=p.demo('a');const roots=p.cls;const found=[];
  const all=[...new Set([...html.matchAll(/class="([^"]+)"/g)].flatMap(m=>m[1].split(/\s+/)))];
  roots.forEach(r=>{if(all.includes(r))found.push([r,CLSNAME[r]||PART['']])});
  all.filter(c=>roots.some(r=>c.startsWith(r+'__'))||(CLSNAME[c]&&!roots.includes(c)&&/ds-(label|help|chev|val|x|tabind|tabpanel|tablist|sort|menu__head|menu__sep)$/.test(c))).forEach(c=>{if(found.some(f=>f[0]===c))return;const suf=c.split('__')[1]||'';found.push([c,CLSNAME[c]||PART[suf]||suf.replace(/-/g,' ').replace(/^./,x=>x.toUpperCase())||c])});
  return found.slice(0,14);
}
function builtFrom(p){
  const html=p.demo('a');
  return PAGES.filter(x=>x.section==='components'&&x.cls&&new RegExp('class="[^"]*\\b'+x.cls[0]+'\\b').test(html)).map(x=>x.id);
}
function tokenUsage(p){
  const cats=[['Colour',/color|text|surface|border|separator|hover|pressed|neutral|success|warning|danger|info|discovery|label|fill|canvas|material|stroke|divider|subtle|focus|inverse|blanket|toggle|green|orange|red|purple|primary|link/],['Spacing',/space|spacing/],['Typography',/font/],['Radius',/radius/],['Elevation',/shadow/],['Sizing',/height/]];
  const per={};
  KS.forEach(k=>{const css=cssFor(k,p.cls);const map=tokenMap(k);const used=new Set();const visit=t=>{for(const m of t.matchAll(/var\((--[\w-]+)/g)){if(!used.has(m[1])&&map[m[1]]!=null){used.add(m[1]);visit(map[m[1]])}}};visit(css);
    per[k]={};[...used].filter(n=>n.startsWith(`--${k}-`)).forEach(n=>{const short=n.slice(4);const c=(cats.find(([,re])=>/radius|shadow|font|space|spacing|height/.test(short)?re.test(short):false)||cats.find(([,re])=>re.test(short))||['Other'])[0];(per[k][c]=per[k][c]||[]).push(short)})});
  const names=[...cats.map(c=>c[0]),'Other'].filter(c=>KS.some(k=>per[k][c]));
  if(!names.length)return `<p class="lead">This ${p.section==='patterns'?'pattern':'component'} reads only semantic aliases shared with its children.</p>`;
  return `<div class="cmp-wrap"><table class="cmp tok-use"><thead><tr><th scope="col">Category</th>${KS.map(k=>`<th scope="col" data-sys="${k}"><i class="mk mk--${k}"></i>${SYS[k].short}</th>`).join('')}</tr></thead><tbody>${names.map(c=>`<tr><th scope="row">${c}</th>${KS.map(k=>`<td data-sys="${k}">${(per[k][c]||[]).sort().map(n=>`<span>--${k}-${n}</span>`).join('')||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const RESP={Actions:['Full labels; icon + label where the language uses icons','Same; group overflow moves into a More menu','Full-width primary action at the bottom of forms; use Large size for touch'],Forms:['Two-column form grids where fields are short','Two columns collapse to one below ~720px','Single column; Large controls for touch; popups stay anchored to the field'],Navigation:['Full header and sidebar','Sidebar collapses to a menu button; tabs scroll sideways','Menu button + drawer; breadcrumbs truncate the middle levels'],'Data Display':['All columns, full density','Tables scroll inside their container; secondary columns can be hidden','Tables scroll; lists and cards stack in one column'],Feedback:['Toasts in each language’s corner','Same','Toasts span the width with a 16px gutter'],Overlays:['Dialogs centred at fixed width; drawers from the edge','Same, max width 100% minus 32px','Dialogs fill the width; drawers take most of the screen'],Layout:['12-column grid','Spans collapse to 6 + 6','Single column'],Editors:['Side-by-side panes where used','Panes stack when narrow','Panes stack; toolbars wrap']};

function codeShell(){

  const q=e.target.value.trim().toLowerCase();let any=0;
  $$('.nav__link').forEach(a=>{const p=PAGES.find(x=>x.id===a.dataset.id);const hit=!q||p.title.toLowerCase().includes(q)||(p.group||p.section).toLowerCase().includes(q);a.parentElement.hidden=!hit;if(hit)any++;const txt=a.querySelector('.nav__txt');txt.innerHTML=q&&p.title.toLowerCase().includes(q)?esc(p.title).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>'):esc(p.title)});
  $$('.nav__grp').forEach(g=>{const vis=$$('li',g).some(li=>!li.hidden);g.hidden=!vis;g.querySelector('.nav__list').hidden=q?!vis:!openGroups.has(g.dataset.grp);g.querySelector('.nav__grp-btn').setAttribute('aria-expanded',String(q?vis:openGroups.has(g.dataset.grp)))});
  $$('.nav__sec').forEach(s=>{s.hidden=!$$('li',s).some(li=>!li.hidden)});
  $('#nav-empty').hidden=!!any;
});
$('#nav-q').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$$('.nav__link').find(a=>a.offsetParent!==null);if(a){location.hash=a.dataset.id;a.focus()}}if(e.key==='ArrowDown'){e.preventDefault();navItems()[0]?.focus()}if(e.key==='Escape'&&e.target.value){e.target.value='';e.target.dispatchEvent(new Event('input'))}});
const navItems=()=>$$('.nav__link,.nav__grp-btn',$('#nav-tree')).filter(x=>x.offsetParent!==null);
$('#nav-tree').addEventListener('keydown',e=>{
  const items=navItems();const i=items.indexOf(document.activeElement);if(i<0)return;const el=items[i];
  if(e.key==='ArrowDown'){e.preventDefault();items[Math.min(items.length-1,i+1)].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();i===0?$('#nav-q').focus():items[i-1].focus()}
  else if(e.key==='Home'){e.preventDefault();items[0].focus()}
  else if(e.key==='End'){e.preventDefault();items[items.length-1].focus()}
  else if(e.key==='ArrowRight'&&el.matches('.nav__grp-btn')){e.preventDefault();if(el.getAttribute('aria-expanded')==='true')navItems()[i+1]?.focus();else setGroup(el.closest('.nav__grp').dataset.grp,true)}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(el.matches('.nav__grp-btn'))setGroup(el.closest('.nav__grp').dataset.grp,false);else{const g=el.closest('.nav__grp');if(g)g.querySelector('.nav__grp-btn').focus()}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!e.target.closest('input,textarea,select,[contenteditable="true"]')){e.preventDefault();if(window.innerWidth<=900)document.body.classList.add('nav-open');$('#nav-q').focus()}
  if(e.key==='Escape'&&document.body.classList.contains('nav-open')&&!layers.length){document.body.classList.remove('nav-open');$('#menu-btn').setAttribute('aria-expanded','false');$('#menu-btn').focus()}
});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>$$('.ds-tablist').forEach(moveInd),80)});

document.body.dataset.show=S.show;
buildNav();applyTheme();
const startId=location.hash.slice(1);
go(PAGES.some(p=>p.id===startId)?startId:'overview');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>$$('.ds-tablist').forEach(moveInd));
</script>
