<form data-s1 novalidate style="display:grid;gap:14px"><h1>Sign in</h1><p class="muted" style="margin:0">Demo page: nothing you type is sent anywhere.</p><button type="button" class="ds-btn is-block"><svg class="ds-ic" aria-hidden="true"><use href="#i-globe"/></svg><span>Continue with Contoso SSO</span></button><div class="ds-divider-label">or</div><div class="ds-field"><label class="ds-label" for="f127">Work email<span class="req" aria-hidden="true">*</span></label><div class="ds-control"><svg class="ds-ic" aria-hidden="true"><use href="#i-mail"/></svg><input id="f127" type="email" required autocomplete="username"></div></div><div class="ds-field"><label class="ds-label" for="f128">Password<span class="req" aria-hidden="true">*</span></label><div class="ds-control"><svg class="ds-ic" aria-hidden="true"><use href="#i-lock"/></svg><input id="f128" type="password" required autocomplete="current-password"></div></div><button type="submit" class="ds-btn ds-btn--primary ds-l is-block"><span>Continue</span></button></form>
<form data-s2 novalidate hidden style="display:grid;gap:14px"><h1>Two-step verification</h1><p class="muted" style="margin:0">Enter the 6-digit code from your authenticator app. Any 6 digits work in this demo.</p><div class="otp" role="group" aria-label="Verification code"><input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3"><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6"></div><label class="ds-check"><input type="checkbox"><span class="ds-check__box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7"/></svg></span><span class="ds-check__txt">Trust this device for 30 days</span></label><button type="submit" class="ds-btn ds-btn--primary ds-l is-block"><span>Verify</span></button><button type="button" class="ds-btn ds-btn--link" data-back><span>Use a different account</span></button></form>
