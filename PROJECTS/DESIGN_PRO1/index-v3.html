<style id="portal-css">
/* Layout: lab bench — fixed index on the left, a sticky control bar, and comparison "benches" where each design language gets its own stage. */
:root{
  --ui-bg:#F2F3F1; --ui-panel:#FFFFFF; --ui-sunken:#E9EAE7; --ui-line:#DDDFDA; --ui-line-2:#C6C9C2;
  --ui-ink:#18191B; --ui-ink-2:#4C4F55; --ui-ink-3:#7D8087;
  --ui-accent:#2B6A5B; --ui-accent-soft:#DCEAE5; --ui-on-accent:#FFFFFF;
  --mk-a:#2457C5; --mk-f:#0A7488; --mk-p:#5C5C64;
  --code-bg:#F7F8F6; --code-fg:#2A2C30; --code-tag:#8A3B12; --code-attr:#2457C5; --code-str:#2B6A5B; --code-prop:#7A3E9D; --code-com:#8A8D93;
  --ui-font:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --ui-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --ui-r:8px; --nav-w:276px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ui-bg:#121314; --ui-panel:#1A1B1D; --ui-sunken:#0E0F10; --ui-line:#2A2C2F; --ui-line-2:#3B3E43;
    --ui-ink:#ECEDEF; --ui-ink-2:#A8ABB1; --ui-ink-3:#7A7E85;
    --ui-accent:#74C2AC; --ui-accent-soft:#1C2E29; --ui-on-accent:#0D1A16;
    --mk-a:#6F98F0; --mk-f:#46B5C8; --mk-p:#A4A4AC;
    --code-bg:#151618; --code-fg:#D9DBDF; --code-tag:#F0A27A; --code-attr:#8DB0F7; --code-str:#86CDB8; --code-prop:#C9A2E6; --code-com:#6E737A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ui-bg:#121314; --ui-panel:#1A1B1D; --ui-sunken:#0E0F10; --ui-line:#2A2C2F; --ui-line-2:#3B3E43;
  --ui-ink:#ECEDEF; --ui-ink-2:#A8ABB1; --ui-ink-3:#7A7E85;
  --ui-accent:#74C2AC; --ui-accent-soft:#1C2E29; --ui-on-accent:#0D1A16;
  --mk-a:#6F98F0; --mk-f:#46B5C8; --mk-p:#A4A4AC;
  --code-bg:#151618; --code-fg:#D9DBDF; --code-tag:#F0A27A; --code-attr:#8DB0F7; --code-str:#86CDB8; --code-prop:#C9A2E6; --code-com:#6E737A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:72px}
body{background:var(--ui-bg);color:var(--ui-ink);font-family:var(--ui-font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ui-panel)}
a{color:inherit}
button{font-family:inherit}
.ui-ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:where(.app) :focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--ui-panel);border-right:1px solid var(--ui-line);z-index:40}
.nav__brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:30px;height:30px;flex:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.brand-mark i{display:block;border-radius:2px;background:var(--mk-a)}
.brand-mark i:nth-child(2){background:var(--mk-f);border-radius:4px}
.brand-mark i:nth-child(3){background:var(--mk-p);border-radius:50%}
.brand-mark i:nth-child(4){background:var(--ui-line-2);border-radius:2px 2px 8px 2px}
.nav__title{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.nav__title small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ui-ink-3);font-size:12px}
.nav__search{margin:0 14px 10px;position:relative}
.nav__search input{width:100%;height:34px;border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:8px;padding:0 34px 0 32px;font:inherit;color:var(--ui-ink)}
.nav__search input:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;background:var(--ui-panel)}
.nav__search .ui-ic{position:absolute;left:10px;top:9px;color:var(--ui-ink-3)}
.nav__search kbd{position:absolute;right:8px;top:7px;font:500 11px var(--ui-mono);color:var(--ui-ink-3);border:1px solid var(--ui-line);border-radius:4px;padding:1px 5px;background:var(--ui-panel)}
.nav__scroll{flex:1;overflow-y:auto;padding:4px 10px 24px;scrollbar-width:thin}
.nav__sec{margin-top:14px}
.nav__head{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ui-ink-3);padding:6px 10px}
.nav__grp-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;font-weight:600;color:var(--ui-ink);cursor:pointer;font-size:13px}
.nav__grp-btn:hover{background:var(--ui-sunken)}
.nav__grp-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:-2px}
.nav__grp-btn .chev{margin-left:auto;transition:transform .18s;color:var(--ui-ink-3)}
.nav__grp-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav__grp-btn .count{font:500 11px var(--ui-mono);color:var(--ui-ink-3)}
.nav__list{list-style:none;margin:0;padding:0}
.nav__grp .nav__list{padding-left:14px;margin-left:16px;border-left:1px solid var(--ui-line)}
.nav__link{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;text-decoration:none;color:var(--ui-ink-2);font-size:13px;position:relative}
.nav__link:hover{background:var(--ui-sunken);color:var(--ui-ink)}
.nav__link[aria-current="page"]{background:var(--ui-accent-soft);color:var(--ui-ink);font-weight:600}
.nav__grp .nav__link[aria-current="page"]::before{content:"";position:absolute;left:-15px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--ui-accent)}
.nav__link .ui-ic{color:var(--ui-ink-3)}
.nav__link[aria-current="page"] .ui-ic{color:var(--ui-accent)}
.nav__link mark{background:transparent;color:var(--ui-accent);font-weight:700}
.nav__empty{padding:12px 10px;color:var(--ui-ink-3);font-size:13px}
.nav__foot{border-top:1px solid var(--ui-line);padding:12px 18px;font-size:12px;color:var(--ui-ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--ui-panel) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ui-line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top__menu{display:none}
.top__path{display:flex;align-items:center;gap:6px;color:var(--ui-ink-3);font-size:13px;min-width:0;flex:1}
.top__path b{color:var(--ui-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top__ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-ink-3)}
.ui-select{height:32px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-panel);color:var(--ui-ink);font:inherit;font-size:13px;padding:0 28px 0 10px;max-width:210px}
.ui-seg{display:inline-flex;background:var(--ui-sunken);border-radius:9px;padding:3px;gap:2px}
.ui-seg button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ui-ink-2);cursor:pointer;white-space:nowrap}
.ui-seg button:hover{color:var(--ui-ink)}
.ui-seg button[aria-pressed="true"]{background:var(--ui-panel);color:var(--ui-ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--ui-line)}
.ui-seg button:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
.ui-iconbtn{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-ink-2);cursor:pointer}
.ui-iconbtn:hover{color:var(--ui-ink);background:var(--ui-sunken)}
.ui-iconbtn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
.mk{display:inline-block;width:9px;height:9px;flex:none}
.mk--a{background:var(--mk-a);border-radius:1px}
.mk--f{background:var(--mk-f);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.mk--p{background:var(--mk-p);border-radius:50%}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;outline:none}
.page-in{max-width:1440px;margin:0 auto;padding-inline:clamp(0px,1.6vw,24px);display:flex;flex-direction:column;gap:32px}

/* ---------- page header ---------- */
.pg-head{display:grid;gap:10px;max-width:880px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ui-accent)}
.pg-head h1{margin:0;font-size:clamp(28px,3.2vw,38px);line-height:1.1;letter-spacing:-.02em;font-weight:650;text-wrap:balance}
.pg-head p{margin:0;color:var(--ui-ink-2);font-size:15.5px;max-width:68ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-ink-2);border:1px solid var(--ui-line);border-radius:999px;padding:3px 10px;background:var(--ui-panel)}
.meta code{font-family:var(--ui-mono);font-size:11.5px}

.pg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ui-line);padding-bottom:12px;margin-bottom:-12px}

/* ---------- bench (comparison) ---------- */
.sec{display:grid;gap:14px;min-width:0}
.sec__h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec__h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ui-ink)}
.sec__h p{margin:0;color:var(--ui-ink-3);font-size:13px}
.bench{display:grid;gap:16px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.bench--rows{grid-template-columns:minmax(0,1fr)}
.lab-col{display:flex;flex-direction:column;min-width:0;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-panel);overflow:visible}
.lab-col__h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ui-line);flex-wrap:wrap}
.lab-col__h b{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.lab-col__h span{font-size:12px;color:var(--ui-ink-3)}
.lab-col__h .spec{margin-left:auto;font:500 11px var(--ui-mono);color:var(--ui-ink-3)}
.lab-stage{flex:1;padding:clamp(16px,2vw,28px);border-radius:0 0 11px 11px;min-width:0;position:relative}
body[data-show="a"] [data-sys]:not([data-sys="a"]),
body[data-show="f"] [data-sys]:not([data-sys="f"]),
body[data-show="p"] [data-sys]:not([data-sys="p"]){display:none!important}

/* states / sizes matrix */
.matrix-wrap{overflow-x:auto;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-panel)}
.matrix{width:100%;border-collapse:collapse;min-width:640px}
.matrix th{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--ui-line);color:var(--ui-ink-2);white-space:nowrap;background:var(--ui-panel)}
.matrix th .mk{margin-right:7px;vertical-align:1px}
.matrix td{border-bottom:1px solid var(--ui-line);vertical-align:middle;padding:0}
.matrix tr:last-child td{border-bottom:0}
.matrix td.st{padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--ui-ink-2);white-space:nowrap;width:110px;background:var(--ui-panel)}
.matrix td.st small{display:block;font:400 11px var(--ui-mono);color:var(--ui-ink-3)}
.matrix td.cell{padding:14px 18px;border-left:1px solid var(--ui-line)}

/* comparison table */
.cmp-wrap{overflow-x:auto;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-panel)}
.cmp{width:100%;border-collapse:collapse;min-width:560px;font-size:13.5px}
.cmp th,.cmp td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--ui-line);vertical-align:top}
.cmp thead th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ui-ink-2);font-weight:700;white-space:nowrap}
.cmp thead th .mk{margin-right:7px;vertical-align:1px}
.cmp tbody th{font-weight:600;color:var(--ui-ink);width:180px}
.cmp tbody tr:last-child>*{border-bottom:0}
.cmp td code{font:500 12px var(--ui-mono);background:var(--ui-sunken);padding:1px 5px;border-radius:4px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.note{border:1px solid var(--ui-line);border-radius:12px;padding:14px 16px;background:var(--ui-panel)}
.note h3{margin:0 0 6px;font-size:13px;font-weight:700}
.note p,.note ul{margin:0;color:var(--ui-ink-2);font-size:13px}
.note ul{padding-left:18px}
.note kbd{font:500 11px var(--ui-mono);border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--ui-bg)}

/* code view */
.code-shell{border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-panel);overflow:hidden;min-width:0}
.code-shell__bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--ui-line)}
.code-shell__bar .grow{flex:1}
.ui-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-ink);font-size:12.5px;font-weight:600;cursor:pointer}
.ui-btn:hover{background:var(--ui-sunken)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
.ui-btn--accent{background:var(--ui-accent);color:var(--ui-on-accent);border-color:var(--ui-accent)}
.ui-btn--accent:hover{background:var(--ui-accent);filter:brightness(1.08)}
.code{margin:0;max-height:560px;overflow:auto;padding:16px 18px;background:var(--code-bg);color:var(--code-fg);font:12.5px/1.65 var(--ui-mono);tab-size:2;white-space:pre}
.code .t{color:var(--code-tag)} .code .at{color:var(--code-attr)} .code .s{color:var(--code-str)} .code .pr{color:var(--code-prop)} .code .c{color:var(--code-com);font-style:italic}

/* pager between pages */
.pg-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ui-line);padding-top:20px}
.pg-nav a{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:10px 14px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-panel);min-width:180px}
.pg-nav a:hover{border-color:var(--ui-line-2)}
.pg-nav a small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-ink-3);font-weight:700}
.pg-nav a b{font-weight:600}
.pg-nav a.next{text-align:right;margin-left:auto}

/* overview */
.hero{display:grid;gap:14px;max-width:920px}
.hero h1{margin:0;font-size:clamp(32px,4.4vw,54px);line-height:1.02;letter-spacing:-.03em;font-weight:650;text-wrap:balance}
.hero p{margin:0;font-size:16.5px;color:var(--ui-ink-2);max-width:66ch}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.verdict{border:1px solid var(--ui-line);border-radius:12px;padding:16px 18px;background:var(--ui-panel);display:grid;gap:8px;align-content:start}
.verdict h3{margin:0;display:flex;align-items:center;gap:8px;font-size:15px}
.verdict p{margin:0;color:var(--ui-ink-2);font-size:13.5px}
.verdict ul{margin:0;padding-left:18px;color:var(--ui-ink-2);font-size:13px;display:grid;gap:3px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ui-line)}
.dots i.on{background:var(--ui-accent)}
.score td{white-space:nowrap}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.jump{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-panel);text-decoration:none}
.jump:hover{border-color:var(--ui-accent)}
.jump b{font-size:13.5px}
.jump span{font-size:12px;color:var(--ui-ink-3)}

/* foundations helpers */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;font-size:11.5px;min-width:0}
.sw__chip{height:52px;border-radius:8px;border:1px solid rgba(127,127,127,.25)}
.sw b{font-weight:600;font-size:12px}
.sw code{font:400 11px var(--ui-mono);color:var(--ui-ink-3);word-break:break-all}
.tok-list{display:grid;gap:6px;font:12px var(--ui-mono)}

.toast-host{position:fixed;z-index:2000;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ui-ink);color:var(--ui-bg);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast-host.show{opacity:1}

.scrim{display:none}
@media (max-width:1180px){
  .bench{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s ease;padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .nav{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .top__menu{display:inline-grid}
  .top__ctrls{width:100%}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
<style id="v3-css">
:root{--ui-ok:#2E7D4F;--ui-bad:#B4232F}

:root[data-theme="dark"]{--ui-ok:#5CC08A;--ui-bad:#F0727B}

/* top bar: primary / secondary / utility */
.top{gap:14px 18px}
.top__primary{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top__lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ui-ink-3);white-space:nowrap}

.ui-seg--quiet{background:transparent;padding:0;gap:0}

.sys-a,.sys-f,.sys-p{font-family:var(--font);color:var(--fg);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls,normal);-webkit-font-smoothing:antialiased}
.lab-stage.sys-a,.lab-stage.sys-f,.lab-stage.sys-p,.cell.sys-a,.cell.sys-f,.cell.sys-p{background:var(--canvas)}
.ds-ic{width:var(--ic);height:var(--ic);flex:none;fill:none;stroke:currentColor;stroke-width:var(--ic-sw);stroke-linecap:round;stroke-linejoin:round}
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--gap)}
.ds-col{display:flex;flex-direction:column;gap:var(--gap)}
.ds-stack{display:flex;flex-direction:column;gap:var(--gap-l)}
.ds-muted{color:var(--fg2)} .ds-faint{color:var(--fg3)} .ds-small{font-size:var(--fs-s)}
.ds-cap{font-size:var(--fs-s);color:var(--fg3);margin:0}
.ds-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* toast & snackbar regions */

.sys-f{--pr-gap:6px;--pr-lbl-fs:14px;--pr-lbl-fw:600;--pr-h:2px;--pr-h-s:2px;--pr-h-l:4px;--pr-r:1px;--pr-track:var(--f-stroke)}

.ds-dialog--danger{--dlg-ic-c:var(--err)}
.sys-a{--dlg-w:480px;--dlg-bg:var(--raised);--dlg-r:var(--a-radius-lg);--dlg-gap:16px;--dlg-pad:24px;--dlg-from:translateY(8px);--dlg-title-fs:20px;--dlg-title-fw:600;--ovl-dur:.15s;--dlg-close-d:none}
.sys-f{--dlg-w:520px;--dlg-bg:var(--raised);--dlg-r:var(--f-radius-lg);--dlg-gap:16px;--dlg-pad:24px;--dlg-from:scale(.96);--dlg-title-fs:20px;--dlg-title-fw:600;--ovl-dur:.25s;--dlg-ic-d:none}

/* drawer */

<script>
'use strict';
/* ===================== core helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ds-ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uic=(n,c='')=>`<svg class="ui-ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7"/></svg>`;
const SPOKES=`<svg class="ds-spin__spokes" viewBox="0 0 24 24" aria-hidden="true">${[0,1,2,3,4,5,6,7].map(i=>`<line x1="12" y1="3" x2="12" y2="7.5" transform="rotate(${i*45} 12 12)" opacity="${(0.25+i*0.107).toFixed(2)}"/>`).join('')}</svg>`;
const SYS={
  a:{name:'Atlassian-inspired',short:'Atlassian',tag:'Dense · productive',spec:'32px · r3–4 · 14px'},
  f:{name:'Fluent-inspired',short:'Fluent',tag:'Structured · layered',spec:'32px · r4/8 · 14px'},
  p:{name:'Apple-inspired',short:'Apple',tag:'Minimal · refined',spec:'36px · r10/14 · 15px'}
};
const KS=['a','f','p'];
let uidN=0; const uid=p=>(p||'u')+(++uidN);
const store={get(k,d){try{const v=localStorage.getItem('dsc:'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('dsc:'+k,v)}catch(e){}}};
const S={show:store.get('show','all'),layout:store.get('layout','cols'),view:'preview',theme:store.get('theme','system'),codeSys:'a',codeFile:'html'};
const HOST_THEME=document.documentElement.getAttribute('data-theme');
const PAGES=[]; const P=o=>{PAGES.push(o);return o};
let cur=null;
const kOf=el=>el&&el.closest('[data-k]')?.dataset.k||'a';
const STATE_LABEL={default:['Default','rest'],hover:['Hover',':hover'],focus:['Focus',':focus-visible'],active:['Active / pressed',':active'],selected:['Selected','aria-selected'],disabled:['Disabled',':disabled'],loading:['Loading','aria-busy'],error:['Error','.is-error'],success:['Success','.is-success'],warning:['Warning','.is-warning'],checked:['Checked',':checked'],indeterminate:['Mixed',':indeterminate']};
const st=s=>({hover:'is-hover',focus:'is-focus',active:'is-active',selected:'is-selected',disabled:'is-disabled',loading:'is-loading',error:'is-error',success:'is-success',warning:'is-warning'}[s]||'');
const SZ={s:'ds-s',m:'',l:'ds-l'};
const SZL={s:'Small',m:'Medium',l:'Large'};
function uiToast(msg){const t=$('#ui-toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}

/* ===================== feedback: toast, snackbar ===================== */
function region(k,snack){
  const sel=`.ds-toasts.sys-${k}${snack?'.ds-toasts--snack':':not(.ds-toasts--snack)'}`;
  let r=$(sel);
  if(!r){r=document.createElement('div');r.className=`ds-toasts sys-${k}${snack?' ds-toasts--snack':''}`;r.dataset.k=k;r.setAttribute('role','status');r.setAttribute('aria-live','polite');document.body.append(r)}
  return r;
}
function toast(k,{title,text='',v='info',actions=''}){
  const reg=region(k);
  const icn={info:'info',success:'ok',warning:'warn',error:'err'}[v]||'info';
  const t=document.createElement('div');
  t.className=`ds-toast ds-toast--${v}`;
  t.innerHTML=`<span class="ds-toast__ic">${ic(icn)}</span><div class="ds-toast__body"><div class="ds-toast__title">${title}</div>${text?`<div class="ds-toast__text">${text}</div>`:''}${actions?`<div class="ds-toast__acts">${actions}</div>`:''}</div><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s" aria-label="Dismiss notification">${ic('x')}</button>`;
  reg.append(t);
  const kill=()=>{if(t.classList.contains('is-leaving'))return;t.classList.add('is-leaving');setTimeout(()=>t.remove(),200)};
  t.querySelector('.ds-ibtn').addEventListener('click',kill);
  t.querySelectorAll('.ds-btn--link').forEach(b=>b.addEventListener('click',kill));
  setTimeout(kill,4500);
  while(reg.children.length>3)reg.firstElementChild.remove();
}
function snack(k,text,action='Undo',onAct){
  const reg=region(k,true);reg.innerHTML='';
  const s=document.createElement('div');s.className='ds-snack';
  s.innerHTML=`<span>${text}</span><button type="button" class="ds-snack__act">${action}</button>`;
  reg.append(s);
  const kill=()=>{s.classList.add('is-leaving');setTimeout(()=>s.remove(),200)};
  s.querySelector('button').addEventListener('click',()=>{kill();onAct&&onAct()});
  setTimeout(kill,5000);
}

/* ===================== overlays ===================== */
const layers=[];
function openLayer(k,html,kind='modal',opener){
  const L=document.createElement('div');
  L.className=`sys-${k} ds-layer ds-layer--${kind}`;L.dataset.k=k;
  L.innerHTML=`<div class="ds-backdrop" data-close></div>${html}`;
  document.body.append(L);layers.push(L);
  const box=L.querySelector('.ds-dialog,.ds-drawer');
  if(box){box.setAttribute('role',box.getAttribute('role')||'dialog');box.setAttribute('aria-modal','true');box.tabIndex=-1}
  requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add('is-open')));
  const focusables=()=>$$('button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])',L).filter(e=>e.offsetParent!==null);
  setTimeout(()=>{const f=L.querySelector('[autofocus]')||focusables()[0]||box;f&&f.focus()},40);
  const close=()=>{if(L._closing)return;L._closing=true;L.classList.remove('is-open');const i=layers.indexOf(L);if(i>-1)layers.splice(i,1);setTimeout(()=>L.remove(),320);opener&&opener.focus&&opener.focus()};
  L._close=close;
  L.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
  L.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.stopPropagation();close()}
    if(e.key==='Tab'){const f=focusables();if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
  });
  return L;
}

/* ===================== popups (select, menus, popovers) ===================== */
function popOf(trigger){return document.getElementById(trigger.getAttribute('aria-controls'))}
function openPop(trigger){
  closePops(trigger);
  const pop=popOf(trigger);if(!pop)return;
  pop.hidden=false;trigger.setAttribute('aria-expanded','true');pop._trigger=trigger;
  if(pop.querySelector('.ds-cal'))renderCal(pop.querySelector('.ds-cal'));
  return pop;
}
function closePop(trigger,focus){
  const pop=popOf(trigger);if(!pop)return;
  pop.hidden=true;trigger.setAttribute('aria-expanded','false');
  trigger.removeAttribute('aria-activedescendant');
  $$('.is-cur',pop).forEach(o=>o.classList.remove('is-cur'));
  if(focus)trigger.focus();
}
function closePops(except){
  $$('[aria-expanded="true"][aria-controls]').forEach(t=>{
    if(t===except)return;
    if(t.matches('.ds-acc__btn,.ds-side__item,[role="treeitem"],.nav__grp-btn,#menu-btn')||t.closest('.ds-cmd'))return;
    const pop=popOf(t);if(!pop||pop.classList.contains('ds-pop--static'))return;
    if(except&&pop.contains(except))return;
    closePop(t);
  });
  $$('.ds-pop--ctx:not([hidden])').forEach(m=>{if(!except||!m.contains(except))m.hidden=true});
}
function opts(list){return $$('.ds-opt',list).filter(o=>!o.hidden&&o.getAttribute('aria-disabled')!=='true'&&o.offsetParent!==null)}
function setCur(list,o,owner){
  $$('.is-cur',list).forEach(x=>x.classList.remove('is-cur'));
  if(!o)return;o.classList.add('is-cur');
  if(!o.id)o.id=uid('opt');
  if(owner)owner.setAttribute('aria-activedescendant',o.id);
  o.scrollIntoView({block:'nearest'});
}
function moveCur(list,dir,owner){
  const os=opts(list);if(!os.length)return;
  const i=os.findIndex(o=>o.classList.contains('is-cur'));
  let n=dir==='first'?0:dir==='last'?os.length-1:i<0?(dir>0?0:os.length-1):(i+dir+os.length)%os.length;
  setCur(list,os[n],owner);
}

/* select / listbox */
function chooseOpt(o){
  const list=o.closest('[role="listbox"]');const multi=list.getAttribute('aria-multiselectable')==='true';

/* calendar */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mo','Tu','We','Th','Fr','Sa','Su'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const sameDay=(a,b)=>a&&b&&a.getTime()===b.getTime();
const fmtDate=d=>d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
function renderCal(cal){
  const s=cal._s||(cal._s={view:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),sel:null,a:null,b:null,mode:cal.dataset.mode||'single'});
  if(cal.dataset.init&&!cal._inited){cal._inited=true;const off=+cal.dataset.init;if(s.mode==='range'){s.a=new Date(TODAY);s.b=new Date(TODAY);s.b.setDate(s.b.getDate()+off)}else{s.sel=new Date(TODAY);s.sel.setDate(s.sel.getDate()+off)}}
  const y=s.view.getFullYear(),m=s.view.getMonth();
  const first=(new Date(y,m,1).getDay()+6)%7;
  const start=new Date(y,m,1-first);
  let cells='';
  const focusDay=s.focus||s.sel||s.a||TODAY;
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const out=d.getMonth()!==m;
    const isSel=s.mode==='range'?(sameDay(d,s.a)||sameDay(d,s.b)):sameDay(d,s.sel);
    const inR=s.mode==='range'&&s.a&&s.b&&d>s.a&&d<s.b;
    const tab=(sameDay(d,focusDay)&&!out)||(!out&&d.getDate()===1&&!(focusDay.getMonth()===m&&focusDay.getFullYear()===y))?0:-1;
    cells+=`<button type="button" class="ds-day${out?' is-out':''}${sameDay(d,TODAY)?' is-today':''}${inR?' in-range':''}" data-t="${d.getTime()}" aria-selected="${isSel}" tabindex="${tab}" aria-label="${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}">${d.getDate()}</button>`;
  }
  cal.innerHTML=`<div class="ds-cal__head"><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s" data-cal="-1" aria-label="Previous month">${ic('chev-left')}</button><span class="ds-cal__title" aria-live="polite">${MONTHS[m]} ${y}</span><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s" data-cal="1" aria-label="Next month">${ic('chev-right')}</button></div><div class="ds-cal__grid" role="grid">${DOW.map(d=>`<span class="ds-cal__dow" aria-hidden="true">${d}</span>`).join('')}${cells}</div>${cal.dataset.foot?`<div class="ds-cal__foot"><button type="button" class="ds-btn ds-btn--link ds-s" data-cal="today">Today</button><button type="button" class="ds-btn ds-btn--subtle ds-s" data-cal="clear">Clear</button></div>`:''}`;
}
function calPick(cal,d){
  const s=cal._s;
  const pop=cal.closest('.ds-pop');const trig=pop&&pop._trigger;
  if(s.mode==='range'){
    if(!s.a||s.b){s.a=d;s.b=null}else{if(d<s.a){s.b=s.a;s.a=d}else s.b=d}
    s.focus=d;renderCal(cal);
    const out=trig&&trig.querySelector('.ds-val');
    if(out){out.textContent=s.b?`${fmtDate(s.a)} – ${fmtDate(s.b)}`:`${fmtDate(s.a)} – Select end date`;out.classList.remove('ds-ph')}
    if(s.b&&trig){closePop(trig,true)}
    else cal.querySelector(`[data-t="${d.getTime()}"]`)?.focus();
  }else{
    s.sel=d;s.focus=d;renderCal(cal);
    const out=trig&&trig.querySelector('.ds-val');
    if(out){out.textContent=fmtDate(d);out.classList.remove('ds-ph')}
    if(trig)closePop(trig,true);else cal.querySelector(`[data-t="${d.getTime()}"]`)?.focus();
  }
}

/* sort */
function sortTable(btn){
  const th=btn.closest('th');const table=th.closest('table');const idx=[...th.parentNode.children].indexOf(th);
  const dir=th.getAttribute('aria-sort')==='ascending'?'descending':'ascending';
  $$('th',table).forEach(h=>h.removeAttribute('aria-sort'));th.setAttribute('aria-sort',dir);
  const tb=table.tBodies[0];const rows=[...tb.rows];
  const val=r=>{const c=r.cells[idx];const v=c.dataset.v!=null?c.dataset.v:c.textContent.trim();return isNaN(+v)?v.toLowerCase():+v};
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*(dir==='ascending'?1:-1)});
  rows.forEach(r=>tb.append(r));
  const live=table.closest('[data-k]')?.querySelector('.ds-sr[aria-live]');if(live)live.textContent=`Sorted by ${btn.textContent.trim()}, ${dir}`;
}

/* range slider fill */

/* pagination */
function renderPager(nav,curP){
  const total=+nav.dataset.total;nav.dataset.cur=curP;
  const pages=[];const add=x=>pages.push(x);
  if(total<=7){for(let i=1;i<=total;i++)add(i)}
  else{add(1);if(curP>4)add('…');for(let i=Math.max(2,curP-1);i<=Math.min(total-1,curP+1);i++)add(i);if(curP<total-3)add('…');add(total)}
  nav.innerHTML=`<button type="button" class="ds-pg ds-pg--nav" data-pg="${curP-1}" aria-label="Previous page" ${curP===1?'disabled':''}>${ic('chev-left')}</button>${pages.map(x=>x==='…'?`<span class="ds-pg-ell" aria-hidden="true">…</span>`:`<button type="button" class="ds-pg" data-pg="${x}" ${x===curP?'aria-current="page"':''} aria-label="Page ${x}">${x}</button>`).join('')}<button type="button" class="ds-pg ds-pg--nav" data-pg="${curP+1}" aria-label="Next page" ${curP===total?'disabled':''}>${ic('chev-right')}</button>`;
  const per=+nav.dataset.per||10,items=+nav.dataset.items||total*per;
  const info=nav.parentElement.querySelector('[data-pager-out]');
  if(info)info.textContent=`Showing ${(curP-1)*per+1}–${Math.min(curP*per,items)} of ${items}`;
}

/* stepper */
function setStep(box,i){
  const steps=$$('.ds-step',box);i=Math.max(0,Math.min(steps.length,i));box.dataset.i=i;
  steps.forEach((s,n)=>{s.classList.toggle('is-done',n<i);s.classList.toggle('is-current',n===i);s.removeAttribute('aria-current');if(n===i)s.setAttribute('aria-current','step');const d=s.querySelector('.ds-step__dot');if(d)d.innerHTML=n<i?ic('check'):String(n+1)});
  const back=box.querySelector('[data-step="-1"]'),next=box.querySelector('[data-step="1"]');
  if(back)back.disabled=i===0;
  if(next){next.querySelector('span').textContent=i>=steps.length-1?'Finish':'Continue';next.disabled=i>=steps.length}
  const out=box.querySelector('[data-step-out]');if(out)out.textContent=i>=steps.length?'All steps complete.':`Step ${i+1} of ${steps.length}: ${steps[i].querySelector('b').textContent}`;
}

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t.closest||!t.closest('[data-k]'))return;
  const k=kOf(t);let el;
  // tablist arrows
  if((el=t.closest('.ds-tab'))){
    const tabs=$$('[role="tab"]',el.parentElement).filter(x=>!x.disabled);const i=tabs.indexOf(el);let n=null;
    if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;
    if(n!=null){e.preventDefault();selectTab(tabs[n],true)}return}

    if(open&&(e.key==='Home'||e.key==='End')&&t.dataset.ds==='select'){e.preventDefault();moveCur(pop,e.key==='Home'?'first':'last',t);return}
    if(e.key==='Enter'||(e.key===' '&&t.dataset.ds==='select')){if(open){const c=pop.querySelector('.is-cur');if(c){e.preventDefault();chooseOpt(c);if(t.dataset.ds==='multi')t.value='',filterList(t)}}else if(t.dataset.ds==='select'){e.preventDefault();openPop(t);setCur(pop,pop.querySelector('[aria-selected="true"]')||opts(pop)[0],t)}return}
    if(e.key==='Escape'&&open){e.preventDefault();closePop(t,true);return}
    if(e.key==='Backspace'&&t.dataset.ds==='multi'&&!t.value){const anchor=t.closest('.ds-anchor');const sel=$$('.ds-opt[aria-selected="true"]',anchor);if(sel.length){sel[sel.length-1].setAttribute('aria-selected','false');syncMulti(anchor)}}
    if(e.key==='Tab'&&open)closePop(t);
    return}
  // menus
  if((el=t.closest('[role="menu"]'))&&t.matches('[role^="menuitem"]')){
    const items=$$('[role^="menuitem"]',el).filter(i=>i.getAttribute('aria-disabled')!=='true');const i=items.indexOf(t);
    if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
    else if(e.key==='Home'){e.preventDefault();items[0].focus()}
    else if(e.key==='End'){e.preventDefault();items[items.length-1].focus()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click()}
    else if(e.key==='Escape'||e.key==='Tab'){const pop=t.closest('.ds-pop');if(pop&&!pop.classList.contains('ds-pop--static')){if(pop._trigger)closePop(pop._trigger,e.key==='Escape');else{pop.hidden=true;pop.closest('[data-ds="ctx"]')?.focus()}}if(e.key==='Escape')e.preventDefault()}
    return}
  if(t.matches('[data-ds="menu"]')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const pop=openPop(t);focusMenu(pop,e.key==='ArrowUp'?'last':'first');return}
  // context menu by keyboard
  if(t.matches('[data-ds="ctx"]')&&(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))){e.preventDefault();openCtx(t,16,16);return}
  // calendar grid keys
  if((el=t.closest('.ds-day'))){
    const cal=el.closest('.ds-cal');const d=new Date(+el.dataset.t);const map={ArrowRight:1,ArrowLeft:-1,ArrowDown:7,ArrowUp:-7};
    if(map[e.key]!=null||e.key==='PageDown'||e.key==='PageUp'){e.preventDefault();const n=new Date(d);if(map[e.key]!=null)n.setDate(d.getDate()+map[e.key]);else n.setMonth(d.getMonth()+(e.key==='PageDown'?1:-1));cal._s.focus=n;cal._s.view=new Date(n.getFullYear(),n.getMonth(),1);renderCal(cal);cal.querySelector(`[data-t="${n.getTime()}"]`)?.focus();return}
    if(e.key==='Escape'){const tr=cal.closest('.ds-pop')?._trigger;if(tr){e.preventDefault();closePop(tr,true)}}
    return}
  if(e.key==='Escape'){
    const pop=t.closest('.ds-pop,.ds-popover');if(pop&&!pop.classList.contains('ds-pop--static')){const tr=pop._trigger||document.querySelector(`[aria-controls="${pop.id}"]`);if(tr){e.preventDefault();closePop(tr,true);return}}

    const tw=t.closest('.ds-tipwrap');if(tw){tw.classList.add('is-off');return}
  }

  if((el=t.closest('.ds-tree__row'))){
    const tree=el.closest('.ds-tree');const rows=treeRows(tree);const i=rows.indexOf(el);const li=el.parentElement;
    const exp=li.getAttribute('aria-expanded');

    return}

  if((el=t.closest('.ds-swatch'))&&['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const all=$$('.ds-swatch',el.closest('[role="radiogroup"]'));const i=all.indexOf(el);const n=all[(i+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1)+all.length)%all.length];n.click();n.focus();return}

function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function fileRow(f,done){return `<li class="ds-file">${ic('file')}<div class="ds-file__meta"><span class="ds-file__name">${esc(f.name)}</span>${done?`<span class="ds-file__sub">${fmtSize(f.size)} · Uploaded</span>`:`<div class="ds-prog ds-s"><div class="ds-prog__track" role="progressbar" aria-label="Uploading ${esc(f.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="ds-prog__bar" style="--v:0%"></div></div></div>`}</div><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s" aria-label="Remove ${esc(f.name)}" data-rm-file>${ic('x')}</button></li>`}
function addFiles(stage,files){
  const list=stage.querySelector('.ds-files');if(!list)return;
  files.forEach(f=>{list.insertAdjacentHTML('beforeend',fileRow(f,false));const li=list.lastElementChild;const bar=li.querySelector('.ds-prog__bar'),tr=li.querySelector('[role="progressbar"]');let v=0;const tm=setInterval(()=>{v=Math.min(100,v+8+Math.random()*18);bar.style.setProperty('--v',v+'%');tr.setAttribute('aria-valuenow',Math.round(v));if(v>=100){clearInterval(tm);li.outerHTML=fileRow(f,true)}},180)});
}

  if(fromInput)$$('.ds-swatch',box).forEach(s=>{const on=s.dataset.hex.toUpperCase()===hex.toUpperCase();s.setAttribute('aria-checked',String(on))});

function runProgress(stage){
  $$('[data-prog-run]',stage).forEach((p,i)=>{const bar=p.querySelector('.ds-prog__bar');const tr=p.querySelector('[role="progressbar"]');const lab=p.querySelector('.ds-prog__head span');let v=0;clearInterval(p._t);p.classList.remove('ds-prog--success');
    p._t=setInterval(()=>{v=Math.min(100,v+3+Math.random()*7);bar.style.setProperty('--v',v+'%');tr.setAttribute('aria-valuenow',Math.round(v));if(lab)lab.textContent=Math.round(v)+'%';if(v>=100){clearInterval(p._t);p.classList.add('ds-prog--success');if(lab)lab.textContent='Done';const h=p.querySelector('.ds-prog__help');if(h)h.textContent='Import finished: 1,284 records'}},120+i*40)});
  $$('.ds-ring',stage).forEach(r=>{let v=0;clearInterval(r._t);r._t=setInterval(()=>{v=Math.min(100,v+4);r.style.setProperty('--v',v);r.querySelector('span').textContent=v+'%';r.setAttribute('aria-valuenow',v);if(v>=100)clearInterval(r._t)},90)});
}

function initCmd(L){

  const draw=()=>{const q=inp.value.trim().toLowerCase();const hits=CMDS.filter(c=>!q||c.l.toLowerCase().includes(q));let g='';let html='';
    hits.forEach((c,i)=>{if(c.g!==g){g=c.g;html+=`<div class="ds-menu__head" role="presentation">${g}</div>`}const lab=q?esc(c.l).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>'):esc(c.l);html+=`<div class="ds-opt" role="option" id="${L.dataset.k}-cmd-${i}" data-label="${esc(c.l)}">${ic(c.ic)}<span class="ds-opt__label">${lab}</span>${c.kbd?`<kbd>${c.kbd}</kbd>`:''}</div>`});
    list.innerHTML=html||`<div class="ds-empty">No commands match “${esc(inp.value)}”. Try “issue” or “go to”.</div>`;moveCur(list,'first',inp)};
  draw();

/* ===================== code view helpers ===================== */
function prettyHTML(src){
  const tokens=src.replace(/>\s+</g,'><').replace(/\s{2,}/g,' ').trim().split(/(<[^>]+>)/).filter(s=>s&&s.trim());
  const voids=/^<(input|br|img|hr|use|meta|link|circle|line|path|rect|source|col)\b/i;
  const out=[];let ind=0;const pad=()=>'  '.repeat(ind);
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(t.startsWith('<svg')){let s=t;while(i+1<tokens.length&&!tokens[i].startsWith('</svg')){i++;s+=tokens[i]}out.push(pad()+s.replace(/<path d="[^"]{40,}"\/>/g,'<path d="…"/>'));continue}
    if(t.startsWith('</')){ind=Math.max(0,ind-1);out.push(pad()+t);continue}
    if(t.startsWith('<')){
      if(!voids.test(t)&&!t.endsWith('/>')&&tokens[i+1]&&!tokens[i+1].startsWith('<')&&tokens[i+2]&&tokens[i+2].startsWith('</')){out.push(pad()+t+tokens[i+1].trim()+tokens[i+2]);i+=2;continue}
      out.push(pad()+t);if(!voids.test(t)&&!t.endsWith('/>')&&!t.startsWith('<!'))ind++;continue}
    out.push(pad()+t.trim());
  }
  return out.join('\n');
}
function hlHTML(s){
  return esc(s).replace(/([\w:-]+)=(&quot;[^&]*?&quot;|"[^"]*")/g,'\u0001at\u0002$1\u0003=\u0001s\u0002$2\u0003').replace(/(&lt;\/?)([\w-]+)/g,'$1\u0001t\u0002$2\u0003').replace(/\u0001(\w+)\u0002/g,'<span class="$1">').replace(/\u0003/g,'</span>');
}
function hlCSS(s){
  return esc(s).replace(/(\/\*[\s\S]*?\*\/)/g,'\u0001c\u0002$1\u0003').replace(/^([^\s{][^{\n]*)\{/gm,'\u0001t\u0002$1\u0003{').replace(/(^|\s)(--?[\w-]+)(\s*:)/gm,'$1\u0001pr\u0002$2\u0003$3').replace(/\u0001(\w+)\u0002/g,'<span class="$1">').replace(/\u0003/g,'</span>');
}
function clsRegex(classes){return new RegExp('\\.('+classes.map(c=>c.replace(/[-]/g,'\\-')).join('|')+')(?![a-z0-9])')}
function fmtRule(t){return t.replace(/\s*\{\s*/,' {\n  ').replace(/;\s*(?=\S)/g,';\n  ').replace(/\s*\}\s*$/,'\n}')}
function cssFor(k,classes){
  const sheet=$('#ds-css').sheet;const re=clsRegex(classes);const out=[];
  for(const r of sheet.cssRules){
    if(!r.selectorText)continue;const sel=r.selectorText;
    if(!re.test(sel))continue;
    if(/\.sys-[afp]/.test(sel)&&!sel.includes('.sys-'+k))continue;
    if(/data-theme/.test(sel))continue;
    out.push(fmtRule(r.cssText));
  }
  return `/* ${SYS[k].name} — rules for ${classes.map(c=>'.'+c).join(', ')} */\n`+out.join('\n');
}
function tokenMap(k){
  const sheet=$('#ds-css').sheet;const map={};
  for(const r of sheet.cssRules){if(r.selectorText===`.sys-${k}`){for(let i=0;i<r.style.length;i++){const p=r.style[i];if(p.startsWith('--'))map[p]=r.style.getPropertyValue(p).trim()}}}
  return map;
}
function tokensFor(k,classes){
  const css=cssFor(k,classes);const map=tokenMap(k);const used=new Set();
  const visit=txt=>{for(const m of txt.matchAll(/var\((--[\w-]+)/g)){if(!used.has(m[1])&&map[m[1]]!=null){used.add(m[1]);visit(map[m[1]])}}};
  visit(css);
  const pre=`--${k}-`;const own=[...used].filter(n=>n.startsWith(pre)).sort();const alias=[...used].filter(n=>!n.startsWith(pre));
  return `/* ${SYS[k].name} — tokens this component reads */\n.sys-${k} {\n  /* design tokens */\n${own.map(n=>`  ${n}: ${map[n]};`).join('\n')}\n\n  /* semantic + component aliases */\n${alias.map(n=>`  ${n}: ${map[n]};`).join('\n')}\n}`;
}

}});

P({id:'elevation',title:'Elevation',section:'foundations',icon:'elev',kind:'custom',render(){
  const lv={a:[['Flat','none'],['Raised','--a-shadow-raised'],['Overlay','--a-shadow-overlay'],['Modal','--a-shadow-modal']],f:[['Shadow 2','--f-shadow-2'],['Shadow 4','--f-shadow-4'],['Shadow 8','--f-shadow-8'],['Shadow 16','--f-shadow-16'],['Shadow 28','--f-shadow-28'],['Shadow 64','--f-shadow-64']],p:[['Flat','none'],['Soft','--p-shadow-soft'],['Float','--p-shadow-float'],['Sheet','--p-shadow-sheet']]};
  const rad={a:['--a-radius-sm','--a-radius','--a-radius-lg'],f:['--f-radius-sm','--f-radius','--f-radius-lg','--f-radius-xl'],p:['--p-radius-sm','--p-radius','--p-radius-lg','--p-radius-xl']};
  return `<div class="page-in"><header class="pg-head"><span class="eyebrow">Foundations</span><h1>Elevation &amp; shape</h1><p>Fluent-inspired depth is a deliberate six-step ramp. Atlassian-inspired depth stays crisp and close to the surface. Apple-inspired depth is rare, wide and soft, and often replaced by translucent materials.</p></header>
  <section class="sec"><div class="sec__h"><h2>Shadow levels</h2></div>${benchHTML(k=>`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px">${lv[k].map(([n,t])=>`<div style="height:84px;border-radius:var(--r-l);background:var(--bg);box-shadow:${t==='none'?'0 0 0 1px var(--sep)':'var('+t+')'};display:flex;flex-direction:column;justify-content:flex-end;padding:10px"><b style="font-size:12px">${n}</b><code style="font:10px 'JetBrains Mono',monospace;color:var(--fg3)">${t}</code></div>`).join('')}</div>`)}</section>
  <section class="sec"><div class="sec__h"><h2>Corner radius</h2></div>${benchHTML(k=>`<div class="ds-row" style="gap:16px;align-items:flex-end">${rad[k].map(t=>`<div style="display:grid;gap:6px;justify-items:center"><span style="width:64px;height:64px;border:2px solid var(--pri);border-radius:var(${t});background:var(--pri-sub)"></span><code style="font:10.5px 'JetBrains Mono',monospace;color:var(--fg3)" data-tok="${t}">${t}</code></div>`).join('')}</div>`)}</section>
  <section class="sec"><div class="sec__h"><h2>Materials</h2><p>A popover over busy content shows how each language separates layers.</p></div>${benchHTML(k=>`<div style="position:relative;height:170px;border-radius:var(--r-l);overflow:hidden;background:repeating-linear-gradient(135deg,var(--pri-sub) 0 14px,transparent 14px 28px),var(--bg)"><div class="ds-pop ds-pop--static" style="position:absolute;left:24px;top:24px;right:24px" role="presentation"><div class="ds-opt">${ic('edit')}<span>Edit issue</span><kbd>E</kbd></div><div class="ds-opt is-cur">${ic('copy')}<span>Duplicate</span></div><div class="ds-opt">${ic('trash')}<span>Delete</span></div></div></div>`)}</section>
  ${cmpTable([['Levels','4 (flat → modal)','6 (2 → 64)','4 (flat → sheet)'],['Card treatment','Hairline + 1px shadow','Shadow 4, no border','No shadow; contrast with grouped background'],['Overlays','Crisp shadow + dark blanket','Shadow 16–64','Blur material + light blanket'],['Radius','3 / 4 / 6px','2 / 4 / 8 / 12px','6 / 10 / 14 / 20px']])}</div>`;
},after(root){$$('[data-tok]',root).forEach(c=>{c.textContent=c.dataset.tok.replace(/^--\w-/,'')+' · '+getComputedStyle(c.closest('.lab-stage')).getPropertyValue(c.dataset.tok).trim()})}});

function cmpTable(spec,title='Comparison'){return `<section class="sec"><div class="sec__h"><h2>${title}</h2></div><div class="cmp-wrap"><table class="cmp"><thead><tr><th scope="col">Property</th>${KS.map(k=>`<th scope="col" data-sys="${k}"><i class="mk mk--${k}"></i>${SYS[k].short}</th>`).join('')}</tr></thead><tbody>${spec.map(r=>`<tr><th scope="row">${r[0]}</th>${KS.map((k,i)=>`<td data-sys="${k}">${r[i+1]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}

<script>

  a11y:'Each input has a visible <code>label</code>. Helper and error text are linked via <code>aria-describedby</code>; invalid inputs set <code>aria-invalid="true"</code>. Required fields use the native <code>required</code> attribute plus a visual asterisk.',keys:KEYS.field});

P({id:'text-area',title:'Text Area',group:'Forms',icon:'form',cls:['ds-control--area','ds-cnt','ds-field'],

P({id:'search',title:'Search',group:'Forms',icon:'search',cls:['ds-control--search','ds-x','ds-cmd-hint'],
  desc:'A search input with a leading icon, clear button and keyboard hint.',
  demo:k=>{const id=uid('s');return `<div class="ds-stack"><div class="ds-field"><label class="ds-label" for="${id}">Search issues</label><div class="ds-control ds-control--search">${ic('search')}<input id="${id}" type="search" placeholder="Search by key, title or assignee" value="billing" aria-describedby="${id}-h"><button type="button" class="ds-x" aria-label="Clear search" data-clear>${ic('x')}</button><span class="ds-cmd-hint" aria-hidden="true"><kbd>/</kbd></span></div><p class="ds-help" id="${id}-h">Press Enter to search</p></div><div class="ds-row" style="gap:6px"><span class="ds-faint ds-small">Recent:</span>${['billing','focus ring','DS-13'].map(x=>`<button type="button" class="ds-chip" data-recent>${ic('clock')}${x}</button>`).join('')}</div></div>`},
  init(st,k){const inp=st.querySelector('input[type=search]');const x=st.querySelector('[data-clear]');const sync=()=>x.hidden=!inp.value;sync();inp.addEventListener('input',sync);x.addEventListener('click',()=>{inp.value='';sync();inp.focus()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toast(k,{title:`Searching for “${inp.value||'everything'}”`,text:'14 issues match in Ledger Migration.'})}});st.addEventListener('click',e=>{const c=e.target.closest('[data-recent]');if(c){e.stopPropagation();c.setAttribute('aria-pressed','false');inp.value=c.textContent.trim();sync();inp.focus()}},true)},

  state:(k,s)=>`<div class="ds-field${s==='disabled'?' is-disabled':''}"><div class="ds-control ds-control--search${ctlState(s)}">${ic('search')}<input type="search" aria-label="Search" placeholder="Search issues"${s==='disabled'?' disabled':''} value="${s==='default'||s==='disabled'?'':'billing'}"></div></div>`,
  sizes:['s','m','l'],size:(k,z)=>`<div class="ds-control ds-control--search ${SZ[z]}">${ic('search')}<input type="search" aria-label="Search" placeholder="Search issues"></div>`,

  a11y:'Uses <code>type="search"</code> with a visible label. The clear button has its own accessible name and returns focus to the input.',keys:[['/','Focus search (app-level)'],['Enter','Run search'],['Esc','Clear (native)']]});

P({id:'multi-select',title:'Multi Select',group:'Forms',icon:'tag',cls:['ds-control--multi','ds-tag','ds-opt'],

function DATE(o={}){
  const id=uid('dp'),pid=id+'-pop';const d=o.init!=null?dPlus(o.init):null;
  const txt=o.range?(o.init!=null?`${fmtDate(TODAY)} – ${fmtDate(dPlus(o.init))}`:'Select dates'):(d?fmtDate(d):'Select a date');
  return `<div class="ds-field${o.state==='error'?' is-error':''}${o.state==='disabled'?' is-disabled':''}"><span class="ds-label" id="${id}-l">${o.label}</span><div class="ds-anchor ds-block"><button type="button" id="${id}" class="ds-control${ctlState(o.state||'')}${o.state==='disabled'?' is-disabled':''}" data-ds="date" aria-haspopup="dialog" aria-expanded="false" aria-controls="${pid}" aria-labelledby="${id}-l ${id}"${o.state==='disabled'?' disabled':''}>${ic('calendar')}<span class="ds-val${o.init==null?' ds-ph':''}" data-ph="${o.range?'Select dates':'Select a date'}">${txt}</span></button><div class="ds-pop" id="${pid}" role="dialog" aria-label="Choose ${o.range?'dates':'date'}" hidden style="min-width:auto"><div class="ds-cal" data-mode="${o.range?'range':'single'}" ${o.init!=null?`data-init="${o.init}"`:''} data-foot="1"></div></div></div>${o.help?`<p class="ds-help">${o.state==='error'?ic('err'):''}${o.help}</p>`:''}</div>`;
}

P({id:'data-grid',title:'Data Grid',group:'Data Display',icon:'grid',cls:['ds-table','ds-tbar','ds-editable','ds-cell-edit'],wide:true,
  desc:'A table with row selection, bulk actions and inline editing.',
  demo:k=>`<div class="ds-col"><div class="ds-tbar" data-tbar><span class="ds-tbar__sel" data-count>No issues selected</span><span class="grow"></span>${B('Assign',{v:'subtle',icon:'user',keep:1,attrs:'data-bulk disabled'})}${B('Move',{v:'subtle',icon:'folder',keep:1,attrs:'data-bulk disabled'})}${B('Delete',{v:'subtle',icon:'trash',keep:1,attrs:'data-bulk disabled data-del'})}</div><div class="ds-tablewrap"><table class="ds-table"><caption class="ds-sr">Editable issues</caption>${issueHead({sel:1})}<tbody>${ISSUES.map(i=>issueRow(i,{sel:1,edit:1})).join('')}</tbody></table></div><p class="ds-cap">Select rows to enable bulk actions. Double-click or press Enter on a summary to edit it.</p><span class="ds-sr" aria-live="polite"></span></div>`,
  init(st,k){
    const all=st.querySelector('[data-all]');const rows=()=>$$('[data-row]',st);
    const sync=()=>{const n=rows().filter(c=>c.checked).length;all.checked=n&&n===rows().length;all.indeterminate=n>0&&n<rows().length;st.querySelector('[data-count]').textContent=n?`${n} selected`:'No issues selected';$$('[data-bulk]',st).forEach(b=>b.disabled=!n);rows().forEach(c=>c.closest('tr').setAttribute('aria-selected',String(c.checked)))};
    st.addEventListener('change',e=>{if(e.target===all)rows().forEach(c=>c.checked=all.checked);sync()});
    st.querySelector('[data-del]').addEventListener('click',()=>{const del=rows().filter(c=>c.checked).map(c=>c.closest('tr'));del.forEach(r=>r.hidden=true);sync();snack(k,`${del.length} issue${del.length>1?'s':''} deleted`,'Undo',()=>{del.forEach(r=>r.hidden=false);sync()});del.forEach(r=>r.querySelector('[data-row]').checked=false);sync()});
    const edit=td=>{if(td.querySelector('input'))return;const old=td.textContent;td.innerHTML=`<input class="ds-cell-edit" value="${esc(old)}" aria-label="Edit summary">`;const inp=td.firstChild;inp.focus();inp.select();const done=save=>{td.textContent=save?inp.value.trim()||old:old;td.focus();if(save&&inp.value.trim()!==old)toast(k,{title:'Summary updated',v:'success',text:td.textContent})};inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(true)}if(e.key==='Escape'){e.stopPropagation();done(false)}});inp.addEventListener('blur',()=>{if(td.contains(inp))done(true)})};
    st.addEventListener('dblclick',e=>{const td=e.target.closest('.ds-editable');if(td)edit(td)});
    st.addEventListener('keydown',e=>{const td=e.target.closest&&e.target.closest('.ds-editable');if(td&&e.target===td&&(e.key==='Enter'||e.key==='F2')){e.preventDefault();edit(td)}});
    sync();
  },
  cmp:[['Selected row','Tint fill','Tint fill + 3px brand edge','Solid tint row, white text'],['Bulk bar','Inline text + subtle buttons','Inline text + subtle buttons','Inline text + subtle buttons'],['Edit cell','Primary outline','Primary outline','Halo ring']],
  a11y:'Row checkboxes have hidden labels (“Select DS-142”). The select-all checkbox shows a mixed state. Editable cells are focusable and open with Enter or F2; Esc cancels.',keys:[['Space','Toggle row selection'],['Enter / F2','Edit the focused cell'],['Esc','Cancel editing']]});

  cmp:[['Header height','36px','48px','52px'],['Chevron','Left, rotates 90°','Right, rotates 180°','Right, rotates 90°'],['Container','None, divider lines','Card, shadow 4','Inset grouped, 14px radius'],['Motion','100ms','150ms','320ms']],
  a11y:'Each header is a <code>button</code> inside a heading, with <code>aria-expanded</code> and <code>aria-controls</code>.',keys:[['Tab','Move between headers'],['Enter / Space','Expand or collapse']]});

P({id:'statistic',title:'Statistic',group:'Data Display',icon:'chart',cls:['ds-stat','ds-stats','ds-spark'],
  desc:'A key number with a label, a trend and an optional sparkline.',
  demo:k=>`<div class="ds-stats">${[['Open issues','128','',-6,'vs last week',[150,148,141,139,136,131,128],1],['Cycle time','3.4','days',-12,'faster',[4.4,4.1,4.0,3.9,3.6,3.5,3.4],1],['Escaped bugs','7','',+2,'vs last sprint',[4,6,5,5,6,5,7],0]].map(([l,v,u,d,ds,data,good])=>`<div class="ds-stat"><span class="ds-stat__label">${l}</span><span class="ds-stat__value">${v}${u?`<small>${u}</small>`:''}</span><span class="ds-stat__delta${good?'':' is-down'}">${ic(d<0?'trend-down':'trend-up')}${d>0?'+':''}${d}% <span>${ds}</span></span>${spark(data)}</div>`).join('')}</div>`,
  cmp:[['Value','24px, 650 weight','28px semibold','38px light, tight tracking'],['Label','11px uppercase','14px semibold','13px medium'],['Container','1px border','Card, shadow 4','Borderless, 20px radius']],
  a11y:'The trend is written in words (“−6% vs last week”), not only colour or arrow. Sparklines are decorative and hidden from screen readers.',keys:KEYS.none});
</script>
<script>
'use strict';
/* ===================== FEEDBACK ===================== */
const ALERTS=[['info','info','Sprint 42 starts tomorrow','Unestimated issues will be moved to the backlog at 09:00.',['Review scope','Dismiss']],['success','ok','Migration dry run passed','All 1,284 invoices matched the v2 schema.',['View report']],['warning','warn','Read replica is 40s behind','Reports may show slightly older numbers until it catches up.',['Check status']],['error','err','Export failed','The CSV exceeded 50 MB. Narrow the date range and try again.',['Retry','Change range']]];
const ALERT=(v,i,t,b,acts,o={})=>`<div class="ds-alert ds-alert--${v}" role="${v==='error'?'alert':'status'}"><span class="ds-alert__ic">${ic(i)}</span><div class="ds-alert__body"><p class="ds-alert__title">${t}</p><p class="ds-alert__text">${b}</p>${acts&&acts.length?`<div class="ds-alert__actions">${acts.map(a=>`<button type="button" class="ds-btn ds-btn--link ds-s"${a==='Dismiss'?' data-ds="dismiss"':''}>${a}</button>`).join('')}</div>`:''}</div>${o.close!==false?`<button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s ds-alert__close" aria-label="Dismiss" data-ds="dismiss">${ic('x')}</button>`:''}</div>`;
P({id:'alert',title:'Alert',group:'Feedback',icon:'info',cls:['ds-alert'],
  desc:'An inline message about the current context. Stays until the user dismisses it or the condition changes.',
  demo:k=>`<div class="ds-col">${ALERTS.map(a=>ALERT(...a)).join('')}</div>`,
  states:['default','error','success','warning'],
  state:(k,s)=>{const a=ALERTS[{default:0,success:1,warning:2,error:3}[s]];return ALERT(a[0],a[1],a[2],a[3],[],{close:false})},
  cmp:[['Background','Tinted fill','Light tint + tinted 1px stroke','White card; icon sits in a tinted circle'],['Layout','Title above body','Title and body inline, actions right','Title above body, generous padding'],['Radius','4px','4px','14px'],['Actions','Text links','Text links aligned right','Tint links']],
  a11y:'Errors use <code>role="alert"</code>; other variants use <code>role="status"</code>. Each variant has a distinct icon and title so meaning does not rely on colour.',keys:[['Tab','Reach actions and the dismiss button']]});

const TOAST_BTNS=k=>`<div class="ds-row">${B('Info toast',{attrs:'data-ds="toast" data-v="info" data-title="Sprint 42 started" data-text="17 issues, 34 points committed."'})}${B('Success',{attrs:'data-ds="toast" data-v="success" data-title="Issue created" data-text="DS-143 was added to the backlog."'})}${B('Warning',{attrs:'data-ds="toast" data-v="warning" data-title="Approaching limit" data-text="Ledger uses 92% of its automation runs."'})}${B('Error',{attrs:'data-ds="toast" data-v="error" data-title="Couldn’t save" data-text="You are offline. Changes are kept locally."'})}</div>`;
P({id:'toast',title:'Toast',group:'Feedback',icon:'bell',cls:['ds-toast','ds-toasts'],
  desc:'A brief, non-blocking notification that confirms an action or reports a background event. Disappears on its own.',
  demo:k=>`<div class="ds-stack">${TOAST_BTNS(k)}<div class="ds-col" style="gap:6px"><span class="ds-label">At rest</span><div class="ds-toast ds-toast--success" style="animation:none;max-width:380px"><span class="ds-toast__ic">${ic('ok')}</span><div class="ds-toast__body"><div class="ds-toast__title">Issue created</div><div class="ds-toast__text">DS-143 was added to the backlog.</div><div class="ds-toast__acts"><button type="button" class="ds-btn ds-btn--link ds-s">View issue</button></div></div><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s" aria-label="Dismiss">${ic('x')}</button></div></div><p class="ds-cap">Live toasts appear in each language’s own corner: bottom-left, bottom-right, or top-centre.</p></div>`,
  cmp:[['Position','Bottom-left (“flags”)','Bottom-right','Top-centre, drops down'],['Surface','White, shadow overlay','White, shadow 28','Blur material, 18px radius'],['Entrance','Slide up, 200ms','Slide in from right, 300ms','Drop + scale, 450ms'],['Duration','4.5s','4.5s','4.5s']],
  a11y:'Toasts render into a <code>role="status"</code> live region so they are announced without stealing focus. Each has a dismiss button; important errors should also appear inline.',keys:[['Tab','Reach toast actions']]});

P({id:'snackbar',title:'Snackbar',group:'Feedback',icon:'message',cls:['ds-snack'],
  desc:'A one-line, dark message at the bottom of the screen, usually with a single undo action.',
  demo:k=>`<div class="ds-stack"><div class="ds-row">${B('Archive 3 issues',{attrs:'data-ds="snack" data-text="3 issues archived"'})}${B('Delete comment',{attrs:'data-ds="snack" data-text="Comment deleted"'})}</div><div class="ds-snack-inline"><div class="ds-snack"><span>3 issues archived</span><button type="button" class="ds-snack__act">Undo</button></div></div></div>`,
  cmp:[['Shape','4px radius bar','4px radius bar','Capsule'],['Height','40px','44px','46px'],['Action colour','Light primary','Light brand','Light tint']],
  a11y:'Rendered in a polite live region. The undo action is a real button and the snackbar stays for 5 seconds.',keys:[['Tab','Reach the undo action']]});

P({id:'banner',title:'Banner',group:'Feedback',icon:'flag',cls:['ds-banner'],
  desc:'A page- or app-level message, such as maintenance windows or account issues.',
  demo:k=>`<div class="ds-col"><div class="ds-banner" role="status">${ic('warn')}<span class="ds-banner__text">Scheduled maintenance Sat 02:00–03:00 UTC. Billing is read-only during this window.</span><a href="#" data-noop>Details</a>${IB('x','Dismiss',{sz:'s',attrs:'data-ds="dismiss"'})}</div><div class="ds-banner ds-banner--info" role="status">${ic('info')}<span class="ds-banner__text">You are viewing Ledger as an admin.</span><a href="#" data-noop>Switch role</a></div><div class="ds-banner ds-banner--error" role="alert">${ic('err')}<span class="ds-banner__text">Your trial ends in 2 days. Add billing details to keep your data.</span><a href="#" data-noop>Add details</a></div></div>`,
  cmp:[['Warning style','Bold yellow, full bleed','Tinted bar with stroke','Soft tint, centred text'],['Info style','Dark inverse bar','Tinted bar','Grey fill'],['Radius','0 (edge to edge)','4px','10px']],
  a11y:'Warnings and info use <code>role="status"</code>; account-blocking problems use <code>role="alert"</code>.',keys:KEYS.none});

P({id:'progress',title:'Progress',group:'Feedback',icon:'chart',cls:['ds-prog','ds-ring'],
  desc:'Shows how far a task has progressed, or that work is happening when the duration is unknown.',
  demo:k=>`<div class="ds-stack"><div class="ds-prog" data-prog-run><div class="ds-prog__head">Importing invoices <span>42%</span></div><div class="ds-prog__track" role="progressbar" aria-label="Importing invoices" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><div class="ds-prog__bar" style="--v:42%"></div></div><span class="ds-prog__help">539 of 1,284 records</span></div><div class="ds-prog ds-prog--ind"><div class="ds-prog__head">Rebuilding search index</div><div class="ds-prog__track" role="progressbar" aria-label="Rebuilding search index"><div class="ds-prog__bar"></div></div></div><div class="ds-prog ds-prog--success"><div class="ds-prog__head">Backup <span>Done</span></div><div class="ds-prog__track" role="progressbar" aria-label="Backup" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><div class="ds-prog__bar" style="--v:100%"></div></div></div><div class="ds-row" style="gap:16px"><span class="ds-ring" role="progressbar" aria-label="Sprint progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68" style="--v:68"><span>68%</span></span>${B('Run import',{v:'primary',attrs:'data-ds="progress"'})}</div></div>`,
  sizes:['s','m','l'],size:(k,z)=>`<div class="ds-prog ${SZ[z]}" style="width:100%"><div class="ds-prog__track" role="progressbar" aria-label="Progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><div class="ds-prog__bar" style="--v:60%"></div></div></div>`,
  cmp:[['Bar thickness','6px','2px','4px'],['Track','Neutral grey','Accessible stroke grey','Translucent fill'],['Label','12px bold above','14px semibold above + helper below','14px medium, percentage right'],['Indeterminate','Ease-in-out sweep','Ease-in-out sweep','Smooth sweep']],
  a11y:'<code>role="progressbar"</code> with <code>aria-valuenow</code> for determinate bars; indeterminate bars omit the value.',keys:KEYS.none});

const SPIN=(sz='',o={})=>`<span class="ds-spin${sz&&SZ[sz]?' '+SZ[sz]:''}${o.inv?' ds-spin--inv':''}" role="status" aria-label="${o.label||'Loading'}">${SPOKES}</span>`;
P({id:'spinner',title:'Spinner',group:'Feedback',icon:'refresh',cls:['ds-spin'],
  desc:'Indicates loading for short, indeterminate waits.',
  demo:k=>`<div class="ds-stack"><div class="ds-spin-row">${SPIN('s')}${SPIN()}${SPIN('l')}</div><div class="ds-row" style="gap:10px">${SPIN('s',{label:'Loading issues'})}<span class="ds-muted">Loading issues…</span></div><div class="ds-row">${B('Saving',{v:'primary',attrs:'aria-busy="true"'})}</div></div>`,
  sizes:['s','m','l'],size:(k,z)=>SPIN(z),
  cmp:[['Form','Thin ring, ¾ arc','Ring on a tinted track','Eight-spoke activity indicator'],['Colour','Subtle grey','Brand','Secondary grey'],['Sizes','16 / 24 / 48','20 / 32 / 56','16 / 24 / 40']],
  a11y:'Spinners carry <code>role="status"</code> and a label. Pair with visible text when the wait could exceed a second.',keys:KEYS.none});

P({id:'skeleton',title:'Skeleton',group:'Feedback',icon:'layout',cls:['ds-skel','ds-skel-card'],
  desc:'Placeholder shapes that mirror the layout while content loads.',
  demo:k=>`<div class="ds-stack"><div data-skel-ph aria-busy="true" aria-label="Loading issue"><div class="ds-skel-card"><span class="ds-skel ds-skel--circle"></span><div><span class="ds-skel ds-skel--line" style="--w:60%"></span><span class="ds-skel ds-skel--line"></span><span class="ds-skel ds-skel--line" style="--w:80%"></span></div></div><span class="ds-skel ds-skel--block" style="margin-top:14px;--h:70px"></span></div><div data-skel-real hidden><div class="ds-skel-card">${AV('MR',1,{name:'Maya Ruiz',sz:'l'})}<div><b>Maya Ruiz</b><span class="ds-muted">Migrate billing tables to new schema</span><span class="ds-faint ds-small">In progress · 8 points · updated 2h ago</span></div></div></div>${B('<span>Show loaded content</span>',{attrs:'data-ds="skel"'})}</div>`,
  cmp:[['Animation','Opacity pulse','Shimmer wave','Slow, soft pulse'],['Shape radius','3px','4px','8px'],['Line height','12px','14px','14px']],
  a11y:'The loading region has <code>aria-busy="true"</code> and a label; shapes are decorative.',keys:KEYS.none});

/* ===================== OVERLAYS ===================== */
const MODAL_INNER=(k,o={})=>`<div class="ds-dialog${o.stat?' ds-dialog--static':''}" role="dialog" aria-labelledby="${o.tid}" ${o.stat?'':'aria-modal="true"'}><div class="ds-dialog__head"><h2 class="ds-dialog__title" id="${o.tid}">Create issue</h2><button type="button" class="ds-btn ds-btn--subtle ds-ibtn ds-s ds-dialog__close" aria-label="Close" data-close>${ic('x')}</button></div><div class="ds-dialog__body">${TF({label:'Summary',ph:'What needs to be done?',req:true,attrs:o.stat?'':'autofocus'})}<div class="ds-form-grid">${TF({label:'Story points',type:'number',val:'3'})}${TF({label:'Assignee',val:'Maya Ruiz',lead:'user'})}</div></div><div class="ds-dialog__foot">${k==='f'?B('Create',{v:'primary',attrs:'data-close data-ok'})+B('Cancel',{attrs:'data-close'}):B('Cancel',{v:k==='a'?'subtle':'',attrs:'data-close'})+B('Create',{v:'primary',attrs:'data-close data-ok'})}</div></div>`;
document.addEventListener('click',e=>{const ok=e.target.closest&&e.target.closest('.ds-layer [data-ok]');if(ok){const L=ok.closest('.ds-layer');toast(L.dataset.k,{title:ok.dataset.msg||'Issue created',text:ok.dataset.text||'DS-143 was added to the backlog.',v:ok.dataset.v||'success'})}},true);
P({id:'modal',title:'Modal',group:'Overlays',icon:'window',cls:['ds-dialog','ds-backdrop','ds-layer'],
  desc:'A focused task that blocks the page until the user completes or cancels it.',
  demo:k=>{const t=uid('tpl');return `<div class="ds-stack">${B('Create issue',{v:'primary',icon:'plus',attrs:`data-ds="layer" data-tpl="${t}"`})}<template id="${t}">${MODAL_INNER(k,{tid:uid('mt')})}</template><div class="ds-col" style="gap:6px"><span class="ds-label">At rest</span>${MODAL_INNER(k,{stat:1,tid:uid('mt')})}</div></div>`},
  cmp:[['Width','480px','520px','380px'],['Radius','6px','8px','20px'],['Blanket','Dark navy, 54%','Black, 40%','Light, 22% + 2px blur'],['Surface','Opaque','Opaque, shadow 64','Translucent blur material'],['Buttons','Right: subtle Cancel, primary Create','Right: primary first, then Cancel','Full-width pair, centred text'],['Close (×)','No','Yes','No'],['Entrance','Slide up 8px, 150ms','Scale from 96%, 250ms','Scale from 108%, 300ms']],
  a11y:'<code>role="dialog"</code> with <code>aria-modal</code> and <code>aria-labelledby</code>. Focus moves inside on open, is trapped while open, and returns to the trigger on close. Esc and the backdrop close it.',keys:KEYS.dialog});

const CONFIRM_INNER=(k,o={})=>`<div class="ds-dialog ds-dialog--danger${o.stat?' ds-dialog--static':''}" role="alertdialog" aria-labelledby="${o.tid}" aria-describedby="${o.tid}-d"><div class="ds-dialog__head"><span class="ds-dialog__ic">${ic('warn')}</span><h2 class="ds-dialog__title" id="${o.tid}">Delete 3 issues?</h2></div><div class="ds-dialog__body"><p id="${o.tid}-d">DS-131, DS-128 and DS-125 and their 14 comments will be permanently deleted. This can’t be undone.</p></div><div class="ds-dialog__foot">${k==='f'?B('Delete',{v:'danger',attrs:'data-close data-ok data-msg="3 issues deleted" data-text="DS-131, DS-128 and DS-125 were deleted." data-v="warning"'})+B('Cancel',{attrs:'data-close autofocus'}):B('Cancel',{v:k==='a'?'subtle':'',attrs:'data-close autofocus'})+B('Delete',{v:'danger',attrs:'data-close data-ok data-msg="3 issues deleted" data-text="DS-131, DS-128 and DS-125 were deleted." data-v="warning"'})}</div></div>`;
P({id:'confirmation-dialog',title:'Confirmation Dialog',group:'Overlays',icon:'warn',cls:['ds-dialog--danger','ds-dialog__ic','ds-dialog__foot'],
  desc:'Asks the user to confirm a destructive or irreversible action. States the consequence plainly.',
  demo:k=>{const t=uid('tpl');return `<div class="ds-stack">${B('Delete 3 issues',{v:'danger',attrs:`data-ds="layer" data-tpl="${t}"`})}<template id="${t}">${CONFIRM_INNER(k,{tid:uid('ct')})}</template><div class="ds-col" style="gap:6px"><span class="ds-label">At rest</span>${CONFIRM_INNER(k,{stat:1,tid:uid('ct')})}</div></div>`},
  cmp:[['Icon','Warning icon beside the title','No icon, title carries meaning','Large icon above a centred title'],['Default focus','Cancel','Cancel','Cancel'],['Destructive button','Red, right','Red, first','Red, right of equal-width pair']],
  a11y:'<code>role="alertdialog"</code> with the consequence linked via <code>aria-describedby</code>. Focus starts on Cancel so Enter never deletes by accident.',keys:KEYS.dialog});

const DRAWER_INNER=(k,o={})=>`<aside class="ds-drawer ds-drawer--${k==='a'?'left':'right'}${o.stat?' ds-drawer--static':''}" role="dialog" aria-labelledby="${o.tid}"><div class="ds-drawer__head"><h2 id="${o.tid}">DS-142 details</h2>${IB('x','Close',{sz:'s',attrs:'data-close'})}</div><div class="ds-drawer__body"><dl class="ds-kv"><dt>Status</dt><dd>${BADGE('In progress','info')}</dd><dt>Assignee</dt><dd><span class="ds-who">${AV('MR',1,{sz:'s'})}Maya Ruiz</span></dd><dt>Sprint</dt><dd>Sprint 42</dd><dt>Points</dt><dd>8</dd><dt>Due</dt><dd>${fmtDate(dPlus(5))}</dd></dl>${o.stat?'':TA({label:'Comment',ph:'Add a comment…',rows:3})}</div>${o.stat?'':`<div class="ds-drawer__foot">${B('Close',{attrs:'data-close'})}${B('Save',{v:'primary',attrs:'data-close data-ok data-msg="Saved" data-text="DS-142 was updated."'})}</div>`}</aside>`;
P({id:'drawer',title:'Drawer',group:'Overlays',icon:'panel',cls:['ds-drawer','ds-layer--drawer'],
  desc:'A panel that slides in from the edge to show details or a secondary task without leaving the page.',
  demo:k=>{const t=uid('tpl');return `<div class="ds-stack">${B('Open issue details',{icon:'panel',attrs:`data-ds="layer" data-kind="drawer" data-tpl="${t}"`})}<template id="${t}">${DRAWER_INNER(k,{tid:uid('dt')})}</template><div class="ds-col" style="gap:6px"><span class="ds-label">At rest</span>${DRAWER_INNER(k,{stat:1,tid:uid('dt')})}</div></div>`},
  cmp:[['Edge','Left','Right','Right, floating 12px from edges'],['Width','400px','420px','380px'],['Radius','0','0','20px'],['Header','No divider','No divider','Hairline divider']],
  a11y:'Same dialog rules as the modal: labelled, focus trapped, Esc closes, focus returns to the trigger.',keys:KEYS.dialog});

P({id:'popover',title:'Popover',group:'Overlays',icon:'message',cls:['ds-popover'],
  desc:'Rich, interactive content anchored to a trigger. Closes when the user clicks elsewhere.',
  demo:k=>{const id=uid('pv');return `<div class="ds-popover-demo" style="display:flex;justify-content:center"><div class="ds-anchor">${B('Estimate',{icon:'info',attrs:`data-ds="pop" aria-haspopup="dialog" aria-expanded="true" aria-controls="${id}"`})}<div class="ds-popover" id="${id}" role="dialog" aria-label="Estimate help"><h4>Story points</h4><p>Use the Fibonacci scale. Anything above 13 should be split before the sprint starts.</p><div class="ds-row" style="gap:8px;justify-content:flex-end">${B('Got it',{v:'primary',sz:'s',attrs:'data-pop-close'})}</div></div></div></div>`},
  init(st){st.addEventListener('click',e=>{if(e.target.closest('[data-pop-close]')){const pop=e.target.closest('.ds-popover');const tr=st.querySelector(`[aria-controls="${pop.id}"]`);closePop(tr,true)}})},
  cmp:[['Beak','None','Yes','Yes'],['Surface','Flat, 4px radius','8px radius, shadow 16','Blur material, 14px radius'],['Offset','6px','10px','12px']],
  a11y:'Trigger has <code>aria-expanded</code> and <code>aria-controls</code>; the popover is a labelled <code>dialog</code>. Esc or an outside click closes it.',keys:[['Enter','Toggle the popover'],['Esc','Close and return focus']]});

P({id:'tooltip',title:'Tooltip',group:'Overlays',icon:'info',cls:['ds-tip','ds-tipwrap'],
  desc:'A short text label that explains an icon or control. Appears on hover and keyboard focus.',
  demo:k=>`<div class="ds-tip-demo">${TIP(IB('edit','Edit issue',{v:'default'}),'Edit issue',{kbd:'E',shown:1})}${TIP(IB('copy','Copy link'),'Copy link')}${TIP(B('Watch',{icon:'eye'}),'Get notified about changes')}${TIP(`<button type="button" class="ds-btn ds-btn--link">What is a story point?</button>`,'A relative measure of effort, not hours')}</div>`,
  cmp:[['Surface','Dark inverse, 3px radius','Light, shadow 8, with beak','Light blur material, no beak'],['Delay','300ms','250ms','600ms'],['Text','12px','12px','12px']],
  a11y:'Linked with <code>aria-describedby</code>. Shows on focus as well as hover, stays while hovered, and Esc hides it (WCAG 1.4.13).',keys:[['Tab','Show on focus'],['Esc','Hide']]});

const CMD_STATIC=k=>`<div class="ds-dialog ds-dialog--static ds-cmd" role="presentation"><div class="ds-cmd__input">${ic('search')}<input type="text" aria-label="Command (preview)" value="go to" tabindex="-1" readonly><kbd>Esc</kbd></div><div class="ds-cmd__list"><div class="ds-menu__head">Navigation</div><div class="ds-opt is-cur">${ic('list')}<span><mark>Go to</mark> Backlog</span><kbd>G B</kbd></div><div class="ds-opt">${ic('grid')}<span><mark>Go to</mark> Board</span><kbd>G O</kbd></div><div class="ds-opt">${ic('chart')}<span><mark>Go to</mark> Reports</span><kbd>G R</kbd></div></div><div class="ds-cmd__foot"><span>↑↓ to move</span><span>Enter to run</span><span>Esc to close</span></div></div>`;
P({id:'command-palette',title:'Command Palette',group:'Overlays',icon:'command',cls:['ds-cmd','ds-cmd__input','ds-cmd__list','ds-layer--cmd'],
  desc:'Keyboard-first search across commands, navigation and recent items.',
  demo:k=>{const t=uid('tpl');return `<div class="ds-stack">${B('Open command palette',{icon:'command',attrs:`data-ds="layer" data-kind="cmd" data-tpl="${t}"`})}<template id="${t}"><div class="ds-dialog ds-cmd" role="dialog" aria-label="Command palette"><div class="ds-cmd__input">${ic('search')}<input type="text" role="combobox" aria-expanded="true" aria-controls="${t}-lb" aria-autocomplete="list" placeholder="Type a command or search…" autofocus autocomplete="off"><kbd>Esc</kbd></div><div class="ds-cmd__list" role="listbox" id="${t}-lb" aria-label="Commands"></div><div class="ds-cmd__foot"><span>↑↓ to move</span><span>Enter to run</span><span>Esc to close</span></div></div></template><div class="ds-col" style="gap:6px"><span class="ds-label">At rest</span>${CMD_STATIC(k)}</div></div>`},
  cmp:[['Input size','14px, 44px row','16px, 52px row','22px light, 58px row (Spotlight-like)'],['Width','560px','600px','640px'],['Results','Dense rows','Rounded rows','Rows with solid tint highlight']],

const CODE_SAMPLE=`// Reconcile invoices after the schema migration
import { db } from './db';

export async function reconcile(batch = 500) {
  const rows = await db.invoices.find({ schema: 'v1' }).limit(batch);
  let matched = 0;

function hlJS(src){
  const re=/(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(import|from|export|async|function|const|let|await|for|of|if|return|new|true|false|null)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)(?=\()/g;
  let out='',last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const cls=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'n':'f';out+=`<span class="tk-${cls}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(src.slice(last))+'\n';
}

const MD_SAMPLE=`## Release notes 4.2

Billing now runs on the **v2 schema**. Invoices load *twice as fast*.

- Bulk export for reports
- New \`reconcile()\` job
- Fixed stale currency codes

> Rollback stays available for 14 days.

Read the [migration guide](#).`;
function mdToHTML(s){
  const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,b)=>`<a href="${/^(https?:|#)/.test(b)?b:'#'}" target="_blank" rel="noopener">${a}</a>`);
  const lines=s.split('\n');let html='',list=false,para=[];
  const flush=()=>{if(para.length){html+=`<p>${inline(para.join(' '))}</p>`;para=[]}};
  for(const l of lines){
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){flush();if(list){html+='</ul>';list=false}html+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if((m=l.match(/^[-*]\s+(.*)/))){flush();if(!list){html+='<ul>';list=true}html+=`<li>${inline(m[1])}</li>`}
    else if((m=l.match(/^>\s?(.*)/))){flush();if(list){html+='</ul>';list=false}html+=`<blockquote>${inline(m[1])}</blockquote>`}
    else if(!l.trim()){flush();if(list){html+='</ul>';list=false}}
    else{if(list){html+='</ul>';list=false}para.push(l)}
  }
  flush();if(list)html+='</ul>';return html;
}
